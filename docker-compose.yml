services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    network_mode: host
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    expose:
      - 8123
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
