id: test_deye_tou_sync_failure
area: deye
description: "Stub exits 1: last-synced date is NOT advanced and its pending-UI marker is removed"
tags: [deye, tou, sync, stub, regression]
status: active

preconditions:
  stub_rc: 1
  entities:
    input_text.pending_ui_operations:
      state: '["sentinel"]'
    input_datetime.deye_tou_last_synced_date:
      state: "2020-01-01 00:00:00"

action:
  type: call_service
  service: script.sync_deye_inverter_tou
  data:
    tomorrow: false
    force: true

wait_seconds: 4.0

assertions:
  - entity: input_text.pending_ui_operations
    state: '["sentinel"]'
  - entity: input_datetime.deye_tou_last_synced_date
    state: "2020-01-01 00:00:00"
