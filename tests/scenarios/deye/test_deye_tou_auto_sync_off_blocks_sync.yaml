id: test_deye_tou_auto_sync_off_blocks_sync
area: deye
description: "Auto-sync switch off: script.sync_deye_inverter_tou stops at its guard, last-synced date untouched"
tags: [deye, tou, sync, auto_sync, stub, regression]
status: active

preconditions:
  stub_rc: 0
  entities:
    input_boolean.deye_tou_auto_sync:
      state: "off"
    input_datetime.deye_tou_last_synced_date:
      state: "2020-01-01 00:00:00"

action:
  type: call_service
  service: script.sync_deye_inverter_tou
  data:
    force: true

wait_seconds: 4.0

# A successful sync would overwrite the date with now(); unchanged value proves the guard blocked it.
assertions:
  - entity: input_datetime.deye_tou_last_synced_date
    state: "2020-01-01 00:00:00"
