language: "pl"
lists:
  radio_station:
    values:
      - in: "(eska rock|eska rok|eski rock|eska)"
        out: "eska_rock"
      - in: "(rmf|rmf fm|er em ef)"
        out: "rmf_fm"
      - in: "(radio zet|zet|zetka)"
        out: "radio_zet"
      - in: "(antyradio|anty radio)"
        out: "antyradio"
      - in: "(radio 357|trzysta pięćdziesiąt siedem)"
        out: "radio_357"
      - in: "(tok fm|tok)"
        out: "tok_fm"
      - in: "(vox fm|vox)"
        out: "vox_fm"
      - in: "(trójka|trojka|polskie radio trójka)"
        out: "trojka"

intents:
  OtworzRygiel:
    data:
      - sentences:
          - "otwórz (drzwi|rygiel|domofon)"
          - "wpuść gości"
          - "otwórz drzwi wejściowe"

  OtworzBrame:
    data:
      - sentences:
          - "otwórz bramę"
          - "otwórz wjazd"

  ZamknijBrame:
    data:
      - sentences:
          - "zamknij bramę"
          - "zamknij wjazd"

  UchylRoleteSypialnia:
    data:
      - sentences:
          - "uchyl roletę (w sypialni|)"
          - "podnieś roletę trochę (w sypialni|)"

  OtworzRoleteSypialnia:
    data:
      - sentences:
          - "otwórz roletę (w sypialni|)"
          - "podnieś roletę (w sypialni|)"

  ZamknijRoleteSypialnia:
    data:
      - sentences:
          - "zamknij roletę (w sypialni|)"
          - "zasłoń roletę (w sypialni|)"
          - "opuść roletę (w sypialni|)"

  ZatrzymajRoleteSypialnia:
    data:
      - sentences:
          - "zatrzymaj roletę (w sypialni|)"
          - "stop roleta"

  ZapytajTaniPrad:
    data:
      - sentences:
          - "kiedy (jest|będzie) najtańszy prąd"
          - "ile kosztuje teraz prąd"
          - "jaka jest cena prądu"
          - "kiedy najlepiej włączyć pralkę"

  ZapytajSmieci:
    data:
      - sentences:
          - "kiedy (jest|będzie) wywóz śmieci"
          - "jakie śmieci jutro"
          - "jakie odpady jutro"
          - "kiedy przyjadą po śmieci"

  TrybDobranoc:
    data:
      - sentences:
          - "dobranoc"
          - "idę spać"
          - "pora spać"

  TrybDzienDobry:
    data:
      - sentences:
          - "dzień dobry"
          - "wstałem"
          - "pobudka"

  TrybWychodze:
    data:
      - sentences:
          - "wychodzę (z domu|)"
          - "wychodzimy"
          - "zabezpiecz dom"

  WlaczRadio:
    data:
      - sentences:
          - "włącz radio {radio_station}"
          - "graj radio {radio_station}"
          - "puść radio {radio_station}"
          - "odtwórz radio {radio_station}"
          - "włącz stację {radio_station}"
          - "graj stację {radio_station}"
          - "puść stację {radio_station}"
          - "włącz radio"
          - "graj radio"
          - "puść radio"
          - "wznów radio"
          - "odtwórz radio"

  ZatrzymajRadio:
    data:
      - sentences:
          - "zatrzymaj radio"
          - "wyłącz radio"
          - "stop radio"
          - "zatrzymaj odtwarzanie"
          - "wyłącz muzykę"
          - "stop muzyka"
          - "stop"
