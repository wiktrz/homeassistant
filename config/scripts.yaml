light_salon_white_adjust:
  alias: Light Salon White Adjust
  description: 'Cycles through white values: 5, 20, 50, 75, 100'
  icon: mdi:brightness-auto
  mode: single
  sequence:
  - choose:
    - conditions:
      - condition: numeric_state
        entity_id: input_number.kolor_bialy_salon
        above: 99
      sequence:
      - data:
          value: 5
        target:
          entity_id: input_number.kolor_bialy_salon
        action: input_number.set_value
    - conditions:
      - condition: numeric_state
        entity_id: input_number.kolor_bialy_salon
        above: 74
      sequence:
      - data:
          value: 100
        target:
          entity_id: input_number.kolor_bialy_salon
        action: input_number.set_value
    - conditions:
      - condition: numeric_state
        entity_id: input_number.kolor_bialy_salon
        above: 49
      sequence:
      - data:
          value: 75
        target:
          entity_id: input_number.kolor_bialy_salon
        action: input_number.set_value
    - conditions:
      - condition: numeric_state
        entity_id: input_number.kolor_bialy_salon
        above: 19
      sequence:
      - data:
          value: 50
        target:
          entity_id: input_number.kolor_bialy_salon
        action: input_number.set_value
    - conditions:
      - condition: numeric_state
        entity_id: input_number.kolor_bialy_salon
        above: 4
      sequence:
      - data:
          value: 20
        target:
          entity_id: input_number.kolor_bialy_salon
        action: input_number.set_value
    default:
    - data:
        value: 5
      target:
        entity_id: input_number.kolor_bialy_salon
      action: input_number.set_value
