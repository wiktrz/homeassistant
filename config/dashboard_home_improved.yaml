  - title: Energia
    path: pstryk
    icon: mdi:transmission-tower
    cards:
      - type: heading
        heading: Pstryk Energy - Ceny i Bilans
      
      - type: grid
        columns: 3
        square: false
        cards:
          - type: tile
            entity: sensor.pstryk_price_meter
            name: Kupno
            color: red
          - type: tile
            entity: sensor.pstryk_current_sell_price
            name: Sprzedaż
            color: green
          - type: tile
            entity: sensor.pstryk_daily_financial_balance
            name: Bilans Dziś
          
          - type: tile
            entity: sensor.pstryk_buy_daily_average
            name: Średnia Kupno (Doba)
          - type: tile
            entity: sensor.pstryk_sell_daily_average
            name: Średnia Sprzedaż (Doba)
          - type: tile
            entity: sensor.pstryk_monthly_financial_balance
            name: Bilans Miesiąc
          
          - type: tile
            entity: sensor.pstryk_best_window
            name: Najlepsze Okno (Ceny)
            icon: mdi:clock-check-outline
            color: purple
          - type: tile
            entity: binary_sensor.pstryk_in_best_window
            name: W Najtańszym Oknie
            color: indigo
          
          - type: tile
            entity: sensor.pstryk_cheapest_window_direct
            name: Najtańsze Okno (Direct Script)
            icon: mdi:script-text-outline
            color: orange
