            title: Kuchnia
            entities:
              - entity: sensor.local00_kuchnia_temperature_controller
                name: Temperatura
              - entity: sensor.local00_kuchnia_heating_state
                name: Grzanie
            footer:
              type: graph
              entity: sensor.local00_kuchnia_temperature_controller

          - type: entities
            title: Salon
            entities:
