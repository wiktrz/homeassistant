title: Dom iPad Edition
views:
  - title: Home
    path: home
    icon: mdi:home
    cards:
      # --- HEADING: QUICK ACTIONS ---
      - type: heading
        heading: Szybki Dostęp
      
      - type: horizontal-stack
        cards:
          - type: tile
            entity: cover.brama_wynajem_zaslona
            name: Brama
            icon: mdi:gate
            tap_action:
              action: toggle
          - type: tile
            entity: light.boneio_32_l_07_73bbd8_door_23_relay
            name: Drzwi
            icon: mdi:door-closed-lock
            tap_action:
              action: perform-action
              perform_action: input_button.press
              target:
                entity_id: input_button.btn_entrance_door
          - type: tile
            entity: script.all_lights_off
            name: Wyłącz Wszystko
            icon: mdi:lightbulb-off
            color: red

      # --- HEADING: WEATHER & WASTE ---
      - type: horizontal-stack
        cards:
          - type: weather-forecast
            entity: weather.forecast_home
            name: Pogoda Dom
            show_current: true
            show_forecast: true
            forecast_type: daily
          
          # Nowa sekcja odpadów obok pogody (lub pod nią w zależności od szerokości)
          - type: vertical-stack
            cards:
              - type: heading
                heading: Odpady
              - type: tile
                entity: sensor.nastepny_wywoz_odpadow
                name: Najbliższy odbiór
                icon: mdi:truck-clock
                vertical: false
                show_entity_picture: false
                # Jeśli używasz sensorów z moich poprzednich wiadomości:
                color: blue 

      # --- HEADING: STREFA DZIENNA ---
      - type: heading
        heading: Strefa Dzienna i Korytarze
      
      - type: grid
        columns: 3
        square: false
        cards:
          - type: tile
            entity: light.salon_mqtt
            name: Salon Główne
          - type: tile
            entity: light.boneio_32_l_07_new_light_18
            name: Salon Dodatkowe
          - type: tile
            entity: light.boneio_dr_8ch_03_2c7fbc_chl_04
            name: Kuchnia
          - type: tile
            entity: light.boneio_dr_8ch_03_2c7fbc_chr_04
            name: Kuchnia (Prawa)
          - type: tile
            entity: light.boneio_32_l_07_new_light_05
            name: Wyspa
          - type: tile
            entity: light.boneio_32_l_07_new_light_06
            name: Jadalnia
          - type: tile
            entity: light.boneio_dr_8ch_03_2c7fbc_chl_01
            name: Korytarz Wejście
          - type: tile
            entity: light.boneio_dr_8ch_03_2c7fbc_chl_02
            name: Korytarz Sypialnie
          - type: tile
            entity: light.boneio_32_l_07_new_light_12
            name: Podjazd

      # --- HEADING: MONITORING ---
      - type: heading
        heading: Monitoring
      
      - type: grid
        columns: 2
        square: false
        cards:
          - type: picture-entity
            entity: camera.reolink_duo_floodlight_poe_plynny_2
            camera_view: auto
            name: Podwórze
          - type: picture-entity
            entity: camera.rlc_822a_plynny
            camera_view: auto
            name: Wejście
          - type: picture-entity
            entity: camera.taras_plynny
            camera_view: auto
            name: Taras
          - type: picture-entity
            entity: camera.rlc_820a_niska_rozdzielczosc
            camera_view: auto
            name: Ogród

      # --- HEADING: ATMOSFERA ---
      - type: heading
        heading: Atmosfera i LED
      
      - type: entities
        entities:
          - entity: input_select.shelly_mode
            name: Tryb Salon
          - entity: input_number.shelly_brightness
            name: Jasność
          - entity: input_number.kolor_bialy_salon
            name: Kanał Biały
          - entity: input_number.kolor_czerwony_salon
            name: Kanał Czerwony

  - title: Multimedia
    path: media
    icon: mdi:television-play
    cards:
      - type: heading
        heading: Salon Rozrywka
      
      - type: media-control
        entity: media_player.salon_2
        name: Apple TV / Speaker
      
      - type: media-control
        entity: media_player.googletv8897_2
        name: Google TV
      
      - type: entities
        title: Sterowanie Pilotem
        entities:
          - entity: remote.salon_2
            name: Pilot Salon

  - title: Klimat
    path: temperatura
    icon: mdi:thermometer
    cards:
      - type: heading
        heading: Temperatura w Pomieszczeniach

      - type: grid
        columns: 2
        square: false
