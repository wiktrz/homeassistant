  - title: Energia
    path: energia
    icon: mdi:transmission-tower
    cards:
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: sensor.pstryk_price_meter
            name: Kupno
            color: |
              {% if states('sensor.pstryk_price_meter') | float > 0.7 %}
                red
              {% elif states('sensor.pstryk_price_meter') | float > 0.5 %}
                orange
              {% else %}
                green
              {% endif %}
          - type: tile
            entity: sensor.pstryk_current_sell_price
            name: Sprzedaż
            color: green
          - type: tile
            entity: sensor.pstryk_daily_financial_balance
            name: Bilans Dziś
          - type: tile
            entity: sensor.pstryk_monthly_financial_balance
            name: Bilans Miesiąc
          - type: tile
            entity: sensor.pstryk_buy_daily_average
            name: Średnia Kupno
          - type: tile
            entity: sensor.pstryk_sell_daily_average
            name: Średnia Sprzedaż
          - type: tile
            entity: sensor.pstryk_best_window
            name: Najlepsze Okno
            icon: mdi:clock-check-outline
            color: purple
          - type: tile
            entity: binary_sensor.pstryk_in_best_window
            name: W Oknie
            color: |
              {% if is_state('binary_sensor.pstryk_in_best_window', 'on') %}
                green
              {% else %}
                grey
              {% endif %}
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: sensor.tesla_y_charging
            name: Ładowanie
            icon: mdi:car-electric
            color: |
              {% if is_state('sensor.tesla_y_charging', 'on') %}
                blue
              {% else %}
                grey
              {% endif %}
          - type: tile
            entity: sensor.tesla_y_battery_level
            name: Bateria
            icon: mdi:battery
            color: |
              {% if states('sensor.tesla_y_battery_level') | float > 80 %}
                green
              {% elif states('sensor.tesla_y_battery_level') | float > 30 %}
                orange
              {% else %}
                red
              {% endif %}
          - type: tile
            entity: sensor.tesla_y_charger_actual_range
            name: Zasięg
            icon: mdi:map-marker-distance
          - type: tile
            entity: device_tracker.tesla_y_location
            name: Lokalizacja
            icon: mdi:map-marker
  - title: Multimedia
    path: media
    icon: mdi:television-play
    cards:
      - type: horizontal-stack
        cards:
          - type: media-control
            entity: media_player.salon_2
            name: Apple TV / Speaker
          - type: media-control
            entity: media_player.googletv8897_2
            name: Google TV
      - type: entities
        entities:
          - entity: remote.salon_2
            name: Pilot Salon
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: scene.salon_kino_1
            name: Kino
            icon: mdi:movie
            color: purple
          - type: tile
            entity: scene.zmierzch
            name: Zmierzch
            icon: mdi:weather-night
            color: indigo
          - type: tile
            entity: scene.motion_lights_off
            name: Ruch OFF
            icon: mdi:motion-sensor-off
            color: red
          - type: tile
            entity: scene.motion_lights_on
            name: Ruch ON
            icon: mdi:motion-sensor
            color: green
