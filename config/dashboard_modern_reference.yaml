  - title: Energia
    path: energia
    icon: mdi:transmission-tower
    cards:
      - type: button
        name: Szczegółowy Raport i Historia Zużycia
        icon: mdi:chart-timeline-variant
        tap_action:
          action: navigate
          navigation_path: /dashboard-home/energia-raport

      - type: heading
        heading: Pstryk Energy — Instalacja Dół

      - type: grid
        columns: 4
        square: false
        cards:
          - type: tile
            entity: sensor.pstryk_cena_kupno_dol
            name: Kupno
            icon: |
              {% if is_state('binary_sensor.pstryk_droga_godzina_dol', 'on') %}
                mdi:tag-alert
              {% elif is_state('binary_sensor.pstryk_tania_godzina_dol', 'on') %}
                mdi:tag-check
              {% else %}
                mdi:currency-usd
              {% endif %}
            color: |
              {% if states('sensor.pstryk_cena_kupno_dol') | float > 0.70 %}
                red
              {% elif states('sensor.pstryk_cena_kupno_dol') | float > 0.50 %}
                orange
              {% else %}
                green
              {% endif %}
            tap_action:
              action: navigate
              navigation_path: /dashboard-home/energia-raport

          - type: tile
            entity: sensor.pstryk_cena_sprzedaz_dol
            name: Sprzedaż
            icon: mdi:cash-refund
            color: green
            tap_action:
              action: navigate
              navigation_path: /dashboard-home/energia-raport

          - type: tile
            entity: sensor.pstryk_best_window_dol
            name: Najlepsze Okno
            icon: |
              {% if is_state('binary_sensor.pstryk_in_best_window_dol', 'on') %}
                mdi:clock-check
              {% else %}
                mdi:clock-outline
              {% endif %}
            color: |
              {% if is_state('binary_sensor.pstryk_in_best_window_dol', 'on') %}
                green
              {% else %}
                purple
              {% endif %}
            tap_action:
              action: navigate
              navigation_path: /dashboard-home/energia-raport

          - type: tile
            entity: sensor.pstryk_zuzycie_dzis_dol
            name: Zużycie Dziś
            icon: mdi:chart-bell-curve-cumulative
            color: blue
            tap_action:
              action: navigate
              navigation_path: /dashboard-home/energia-raport

          - type: tile
            entity: sensor.pstryk_koszt_dzis_dol
            name: Koszt Dziś
            icon: mdi:cash
            color: amber
            tap_action:
              action: navigate
              navigation_path: /dashboard-home/energia-raport

          - type: tile
            entity: sensor.pstryk_zuzycie_miesiac_dol
            name: Zużycie Miesiąc
            icon: mdi:calendar-month
            color: indigo
            tap_action:
              action: navigate
              navigation_path: /dashboard-home/energia-raport

          - type: tile
            entity: sensor.pstryk_koszt_miesiac_dol
            name: Koszt Miesiąc
            icon: mdi:wallet
            color: deep-orange
            tap_action:
              action: navigate
              navigation_path: /dashboard-home/energia-raport

          - type: tile
            entity: sensor.pstryk_slad_weglowy_dol
            name: Ślad Węglowy
            icon: mdi:molecule-co2
            color: teal
            tap_action:
              action: navigate
              navigation_path: /dashboard-home/energia-raport

      - type: heading
        heading: Pstryk Energy — Instalacja Góra

      - type: grid
        columns: 4
        square: false
        cards:
          - type: tile
            entity: sensor.pstryk_cena_kupno_gora
            name: Kupno
            icon: |
              {% if is_state('binary_sensor.pstryk_droga_godzina_gora', 'on') %}
                mdi:tag-alert
              {% elif is_state('binary_sensor.pstryk_tania_godzina_gora', 'on') %}
                mdi:tag-check
              {% else %}
                mdi:currency-usd
              {% endif %}
            color: |
              {% if states('sensor.pstryk_cena_kupno_gora') | float > 0.70 %}
                red
              {% elif states('sensor.pstryk_cena_kupno_gora') | float > 0.50 %}
                orange
              {% else %}
                green
              {% endif %}
            tap_action:
              action: navigate
              navigation_path: /dashboard-home/energia-raport

          - type: tile
            entity: sensor.pstryk_cena_sprzedaz_gora
            name: Sprzedaż
            icon: mdi:cash-refund
            color: green
            tap_action:
              action: navigate
              navigation_path: /dashboard-home/energia-raport

          - type: tile
            entity: sensor.pstryk_best_window_gora
            name: Najlepsze Okno
            icon: |
              {% if is_state('binary_sensor.pstryk_in_best_window_gora', 'on') %}
                mdi:clock-check
              {% else %}
                mdi:clock-outline
              {% endif %}
            color: |
              {% if is_state('binary_sensor.pstryk_in_best_window_gora', 'on') %}
                green
              {% else %}
                purple
              {% endif %}
            tap_action:
              action: navigate
              navigation_path: /dashboard-home/energia-raport

          - type: tile
            entity: sensor.pstryk_zuzycie_dzis_gora
            name: Zużycie Dziś
            icon: mdi:chart-bell-curve-cumulative
            color: blue
            tap_action:
              action: navigate
              navigation_path: /dashboard-home/energia-raport

          - type: tile
            entity: sensor.pstryk_koszt_dzis_gora
            name: Koszt Dziś
            icon: mdi:cash
            color: amber
            tap_action:
              action: navigate
              navigation_path: /dashboard-home/energia-raport

          - type: tile
            entity: sensor.pstryk_zuzycie_miesiac_gora
            name: Zużycie Miesiąc
            icon: mdi:calendar-month
            color: indigo
            tap_action:
              action: navigate
              navigation_path: /dashboard-home/energia-raport

          - type: tile
            entity: sensor.pstryk_koszt_miesiac_gora
            name: Koszt Miesiąc
            icon: mdi:wallet
            color: deep-orange
            tap_action:
              action: navigate
              navigation_path: /dashboard-home/energia-raport

          - type: tile
            entity: sensor.pstryk_slad_weglowy_gora
            name: Ślad Węglowy
            icon: mdi:molecule-co2
            color: teal
            tap_action:
              action: navigate
              navigation_path: /dashboard-home/energia-raport

      # --- POMIARY HISTORYCZNE I TESLA (LEGACY PHASE 1) ---
      - type: heading
        heading: Pomiary Historyczne i Tesla

      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: sensor.pstryk_price_meter_dol
            name: Kupno
            color: |
              {% if states('sensor.pstryk_price_meter_dol') | float > 0.7 %}
                red
              {% elif states('sensor.pstryk_price_meter_dol') | float > 0.5 %}
                orange
              {% else %}
                green
              {% endif %}
          - type: tile
            entity: sensor.pstryk_current_sell_price
            name: Sprzedaż
            color: green
          - type: tile
            entity: sensor.pstryk_daily_financial_balance
            name: Bilans Dziś
          - type: tile
            entity: sensor.pstryk_monthly_financial_balance
            name: Bilans Miesiąc
          - type: tile
            entity: sensor.pstryk_buy_daily_average
            name: Średnia Kupno
          - type: tile
            entity: sensor.pstryk_sell_daily_average
            name: Średnia Sprzedaż
          - type: tile
            entity: sensor.pstryk_best_window_dol
            name: Najlepsze Okno
            icon: mdi:clock-check-outline
            color: purple
          - type: tile
            entity: binary_sensor.pstryk_in_best_window_dol
            name: W Oknie
            color: |
              {% if is_state('binary_sensor.pstryk_in_best_window_dol', 'on') %}
                green
              {% else %}
                grey
              {% endif %}
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: sensor.tesla_y_charging
            name: Ładowanie
            icon: mdi:car-electric
            color: |
              {% if is_state('sensor.tesla_y_charging', 'on') %}
                blue
              {% else %}
                grey
              {% endif %}
          - type: tile
            entity: sensor.tesla_y_battery_level
            name: Bateria
            icon: mdi:battery
            color: |
              {% if states('sensor.tesla_y_battery_level') | float > 80 %}
                green
              {% elif states('sensor.tesla_y_battery_level') | float > 30 %}
                orange
              {% else %}
                red
              {% endif %}
          - type: tile
            entity: sensor.tesla_y_charger_actual_range
            name: Zasięg
            icon: mdi:map-marker-distance
          - type: tile
            entity: device_tracker.tesla_y_location
            name: Lokalizacja
            icon: mdi:map-marker

  - title: Raport Energii
    path: energia-raport
    subview: true
    icon: mdi:chart-timeline-variant
    cards:
      - type: heading
        heading: Raport Zużycia i Kosztów Energii (Pstryk)

      # --- PODSUMOWANIE I PORÓWNANIE (DÓŁ VS GÓRA) ---
      - type: heading
        heading: Porównanie Instalacji (Dół vs Góra)

      - type: grid
        columns: 4
        square: false
        cards:
          - type: tile
            entity: sensor.pstryk_zuzycie_dzis_dol
            name: Dół — Dziś (kWh)
            icon: mdi:lightning-bolt
            color: blue
          - type: tile
            entity: sensor.pstryk_koszt_dzis_dol
            name: Dół — Dziś (PLN)
