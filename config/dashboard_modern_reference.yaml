  - title: Energia
    path: energia
    icon: mdi:transmission-tower
    cards:
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: sensor.pstryk_price_meter_dol
            name: Kupno
            color: |
              {% if states('sensor.pstryk_price_meter_dol') | float > 0.7 %}
                red
              {% elif states('sensor.pstryk_price_meter_dol') | float > 0.5 %}
                orange
              {% else %}
                green
              {% endif %}
          - type: tile
            entity: sensor.pstryk_current_sell_price
            name: Sprzedaż
            color: green
          - type: tile
            entity: sensor.pstryk_daily_financial_balance
            name: Bilans Dziś
          - type: tile
            entity: sensor.pstryk_monthly_financial_balance
            name: Bilans Miesiąc
          - type: tile
            entity: sensor.pstryk_buy_daily_average
            name: Średnia Kupno
          - type: tile
            entity: sensor.pstryk_sell_daily_average
            name: Średnia Sprzedaż
          - type: tile
            entity: sensor.pstryk_best_window_dol
            name: Najlepsze Okno
            icon: mdi:clock-check-outline
            color: purple
          - type: tile
            entity: binary_sensor.pstryk_in_best_window_dol
            name: W Oknie
            color: |
              {% if is_state('binary_sensor.pstryk_in_best_window_dol', 'on') %}
                green
              {% else %}
                grey
              {% endif %}
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: sensor.tesla_y_charging
            name: Ładowanie
            icon: mdi:car-electric
            color: |
              {% if is_state('sensor.tesla_y_charging', 'on') %}
                blue
              {% else %}
                grey
              {% endif %}
          - type: tile
            entity: sensor.tesla_y_battery_level
            name: Bateria
            icon: mdi:battery
            color: |
              {% if states('sensor.tesla_y_battery_level') | float > 80 %}
                green
              {% elif states('sensor.tesla_y_battery_level') | float > 30 %}
                orange
              {% else %}
                red
              {% endif %}
          - type: tile
            entity: sensor.tesla_y_charger_actual_range
            name: Zasięg
            icon: mdi:map-marker-distance
          - type: tile
            entity: device_tracker.tesla_y_location
            name: Lokalizacja
            icon: mdi:map-marker
  - title: Multimedia
    path: media
    icon: mdi:television-play
    cards:
      # --- ODTWARZACZE & KONTROLA TV (Oryginalne karty z przyciskiem zasilania) ---
      - type: horizontal-stack
        cards:
          - type: media-control
            entity: media_player.salon_2
            name: Apple TV / Speaker
          - type: media-control
            entity: media_player.googletv8897_2
            name: Google TV

      # --- GŁÓWNY WŁĄCZNIK & PILOT SALON (Przycisk włączania TV) ---
      - type: entities
        title: Zasilanie Telewizora
        show_header_toggle: false
        entities:
          - entity: remote.salon_2
            name: Pilot Salon (Włącznik / Wyłącznik TV)
            icon: mdi:remote-tv

      # --- SCENY I NASTRÓJ ---
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: scene.salon_kino_1
            name: Kino
            icon: mdi:movie
            color: purple
          - type: tile
            entity: scene.zmierzch
            name: Zmierzch
            icon: mdi:weather-night
            color: indigo
          - type: tile
            entity: scene.motion_lights_off
            name: Ruch OFF
            icon: mdi:motion-sensor-off
            color: red
          - type: tile
            entity: scene.motion_lights_on
            name: Ruch ON
            icon: mdi:motion-sensor
            color: green

      # --- INTELIGENTNY TRYB KINO (Z CZASEM ZMROKU) ---
      - type: horizontal-stack
        cards:
          - type: tile
            entity: script.salon_cinema_mode
            name: Tryb Kino (Automatyka Zmroku)
            icon: mdi:movie-open
            color: purple
            tap_action:
              action: perform-action
              perform_action: script.salon_cinema_mode
              target:
                entity_id: script.salon_cinema_mode
          - type: tile
            entity: remote.salon_2
            name: Przełącz Zasilanie TV
            icon: mdi:power
            color: red
            tap_action:
              action: perform-action
              perform_action: remote.toggle
              target:
                entity_id: remote.salon_2

      # --- APLIKACJE STREAMINGOWE ---
      - type: heading
        heading: Aplikacje na Telewizorze

      - type: grid
        columns: 3
        square: false
        cards:
          - type: tile
            entity: remote.salon_2
            name: Netflix
            icon: mdi:netflix
            color: red
            tap_action:
              action: perform-action
              perform_action: script.tv_launch_app
              data:
                app: netflix

          - type: tile
            entity: remote.salon_2
            name: YouTube
            icon: mdi:youtube
            color: red
            tap_action:
              action: perform-action
              perform_action: script.tv_launch_app
              data:
                app: youtube

          - type: tile
            entity: remote.salon_2
            name: Disney+
            icon: mdi:television-classic
            color: blue
            tap_action:
              action: perform-action
              perform_action: script.tv_launch_app
              data:
                app: disney

          - type: tile
            entity: remote.salon_2
            name: Max
            icon: mdi:movie-play
            color: deep-purple
            tap_action:
              action: perform-action
              perform_action: script.tv_launch_app
              data:
                app: max

          - type: tile
            entity: remote.salon_2
            name: Spotify
            icon: mdi:spotify
            color: green
            tap_action:
              action: perform-action
              perform_action: script.tv_launch_app
              data:
                app: spotify

          - type: tile
            entity: remote.salon_2
            name: Prime Video
            icon: mdi:amazon
            color: light-blue
            tap_action:
              action: perform-action
              perform_action: script.tv_launch_app
              data:
                app: prime_video

      # --- NAWIGACJA I PILOT D-PAD (Zawsze widoczny) ---
      - type: vertical-stack
        cards:
          - type: heading
            heading: Nawigacja i Pilot

          - type: grid
            columns: 3
            square: false
            cards:
              - type: button
                icon: mdi:arrow-left
                name: Wstecz
                tap_action:
                  action: perform-action
                  perform_action: remote.send_command
                  target:
                    entity_id: remote.salon_2
                  data:
                    command: BACK
              - type: button
                icon: mdi:chevron-up
                name: Góra
                tap_action:
                  action: perform-action
                  perform_action: remote.send_command
                  target:
                    entity_id: remote.salon_2
                  data:
                    command: DPAD_UP
              - type: button
                icon: mdi:home
                name: Home
                tap_action:
                  action: perform-action
                  perform_action: remote.send_command
                  target:
                    entity_id: remote.salon_2
                  data:
                    command: HOME
              - type: button
                icon: mdi:chevron-left
                name: Lewo
                tap_action:
                  action: perform-action
                  perform_action: remote.send_command
                  target:
                    entity_id: remote.salon_2
                  data:
                    command: DPAD_LEFT
              - type: button
                icon: mdi:circle
                name: OK
                tap_action:
                  action: perform-action
                  perform_action: remote.send_command
                  target:
                    entity_id: remote.salon_2
                  data:
                    command: DPAD_CENTER
              - type: button
                icon: mdi:chevron-right
                name: Prawo
                tap_action:
                  action: perform-action
                  perform_action: remote.send_command
                  target:
                    entity_id: remote.salon_2
                  data:
                    command: DPAD_RIGHT
              - type: button
                icon: mdi:volume-minus
                name: Ciszej
                tap_action:
                  action: perform-action
                  perform_action: remote.send_command
                  target:
                    entity_id: remote.salon_2
                  data:
                    command: VOLUME_DOWN
              - type: button
                icon: mdi:chevron-down
                name: Dół
                tap_action:
                  action: perform-action
                  perform_action: remote.send_command
                  target:
                    entity_id: remote.salon_2
                  data:
                    command: DPAD_DOWN
              - type: button
                icon: mdi:volume-plus
                name: Głośniej
                tap_action:
                  action: perform-action
                  perform_action: remote.send_command
                  target:
                    entity_id: remote.salon_2
                  data:
                    command: VOLUME_UP

      # --- KAMERY I STRUMIENIOWANIE NA TV ---
      - type: heading
        heading: Kamery — Podgląd i Przesyłanie na TV

      - type: grid
        columns: 2
        square: false
        cards:
          - type: picture-glance
            title: Podwórze
            camera_image: camera.reolink_duo_floodlight_poe_plynny_2
            camera_view: live
            entities:
              - entity: media_player.googletv8897_2
                icon: mdi:cast-connected
                tap_action:
                  action: perform-action
                  perform_action: script.tv_show_camera
                  data:
                    camera: podworko
              - entity: media_player.googletv8897_2
                icon: mdi:cast-off
                tap_action:
                  action: perform-action
                  perform_action: script.tv_show_camera
                  data:
                    camera: stop

          - type: picture-glance
            title: Wejście
            camera_image: camera.rlc_822a_plynny
            camera_view: live
            entities:
              - entity: media_player.googletv8897_2
                icon: mdi:cast-connected
                tap_action:
                  action: perform-action
                  perform_action: script.tv_show_camera
                  data:
                    camera: wejscie
              - entity: media_player.googletv8897_2
                icon: mdi:cast-off
                tap_action:
                  action: perform-action
                  perform_action: script.tv_show_camera
                  data:
                    camera: stop

          - type: picture-glance
            title: Taras
            camera_image: camera.taras_plynny
            camera_view: live
            entities:
              - entity: media_player.googletv8897_2
                icon: mdi:cast-connected
                tap_action:
                  action: perform-action
                  perform_action: script.tv_show_camera
                  data:
                    camera: taras
              - entity: media_player.googletv8897_2
                icon: mdi:cast-off
                tap_action:
                  action: perform-action
                  perform_action: script.tv_show_camera
                  data:
                    camera: stop

          - type: picture-glance
            title: Ogród
            camera_image: camera.rlc_820a_niska_rozdzielczosc
            camera_view: live
            entities:
              - entity: media_player.googletv8897_2
                icon: mdi:cast-connected
                tap_action:
                  action: perform-action
                  perform_action: script.tv_show_camera
                  data:
                    camera: ogrod
              - entity: media_player.googletv8897_2
                icon: mdi:cast-off
                tap_action:
                  action: perform-action
                  perform_action: script.tv_show_camera
                  data:
                    camera: stop

          - type: picture-glance
            title: Front / Brama
            camera_image: camera.520a_plynny
            camera_view: live
            entities:
              - entity: media_player.googletv8897_2
                icon: mdi:cast-connected
                tap_action:
