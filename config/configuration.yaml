intent_script:
  OtworzRygiel:
    speech:
      text: "Otwieram rygiel drzwi wejściowych"
    action:
      - action: input_button.press
        target:
          entity_id: input_button.btn_entrance_door

  OtworzBrame:
    speech:
      text: "Otwieram bramę wjazdową"
    action:
      - action: cover.open_cover
        target:
          entity_id: cover.brama_wynajem_zaslona

  ZamknijBrame:
    speech:
      text: "Zamykam bramę wjazdową"
    action:
      - action: cover.close_cover
        target:
          entity_id: cover.brama_wynajem_zaslona

  UchylRoleteSypialnia:
    speech:
      text: "Uchylam roletę w sypialni"
    action:
      - action: script.roller_bedroom_up_1_5

  OtworzRoleteSypialnia:
    speech:
      text: "Otwieram roletę w sypialni"
    action:
      - action: script.roller_bedroom_on

  ZamknijRoleteSypialnia:
    speech:
      text: "Zasłaniam roletę w sypialni"
    action:
      - action: script.roller_bedroom_down

  ZatrzymajRoleteSypialnia:
    speech:
      text: "Zatrzymuję roletę w sypialni"
    action:
      - action: script.turn_off
        target:
          entity_id:
            - script.roller_bedroom_on
            - script.roller_bedroom_down
            - script.roller_bedroom_down_almost
            - script.roller_bedroom_up_1_3
            - script.roller_bedroom_up_1_5

  ZapytajTaniPrad:
    speech:
      text: >
        {% set best = states('sensor.pstryk_best_window_dol') %}
        {% set price = states('sensor.pstryk_price_meter_dol') %}
        {% if best not in ['unavailable', 'unknown', 'None'] %}
          Najtańszy prąd będzie w godzinach {{ best }}. Aktualna cena wynosi {{ price }} zł za kilowatogodzinę.
        {% else %}
          Aktualna cena prądu wynosi {{ price }} zł za kilowatogodzinę.
        {% endif %}

  ZapytajSmieci:
    speech:
      text: >
        {% set next_waste = states('sensor.nastepny_wywoz_odpadow') %}
        {% set days = state_attr('sensor.nastepny_wywoz_odpadow', 'dni_pozostalo') %}
        {% if next_waste not in ['unavailable', 'unknown', 'Brak danych'] %}
          Najbliższy odbiór to {{ next_waste }}, za {{ days }} dni.
        {% else %}
          Brak informacji o najbliższym wywozie śmieci.
        {% endif %}

  TrybDobranoc:
    speech:
      text: "Dobranoc. Gaszę światła i opuszczam roletę w sypialni."
    action:
      - action: script.all_lights_off
      - action: script.roller_bedroom_down_almost

  TrybDzienDobry:
    speech:
      text: "Dzień dobry. Podnoszę roletę w sypialni."
    action:
      - action: script.roller_bedroom_on

  TrybWychodze:
    speech:
      text: "Wszystkie światła zostały wyłączone. Do zobaczenia."
    action:
      - action: script.all_lights_off

  WlaczRadio:
    speech:
      text: >-
        {% set station_names = {
          'eska_rock': 'radio Eska Rock',
          'rmf_fm': 'radio RMF FM',
          'radio_zet': 'Radio ZET',
          'antyradio': 'Antyradio',
          'radio_357': 'Radio 357',
          'tok_fm': 'radio TOK FM',
          'vox_fm': 'radio VOX FM',
          'trojka': 'Polskie Radio Trójka'
        } %}
        {% if radio_station is defined and radio_station in station_names %}
          Włączam {{ station_names[radio_station] }}
        {% else %}
          {% set last = states('input_select.last_radio_station') %}
          {% set sel = last if last in station_names else 'eska_rock' %}
          Wznawiam {{ station_names[sel] }}
        {% endif %}
    action:
      - action: script.play_radio
        data:
          station: "{{ radio_station | default('') }}"

  ZatrzymajRadio:
    speech:
      text: "Zatrzymuję radio"
    action:
      - action: script.stop_radio

  WlaczAplikacjeTV:
    speech:
      text: >-
        {% set app_names = {
          'netflix': 'Netflix',
          'youtube': 'YouTube',
          'disney': 'Disney Plus',
          'max': 'Max',
          'spotify': 'Spotify',
          'prime_video': 'Prime Video'
        } %}
        {% if streaming_app is defined and streaming_app in app_names %}
          Włączam {{ app_names[streaming_app] }} na telewizorze
        {% else %}
          Uruchamiam aplikację na telewizorze
        {% endif %}
    action:
      - action: script.tv_launch_app
        data:
          app: "{{ streaming_app | default('netflix') }}"

  GlosniejTV:
    speech:
      text: "Zgłaśniam telewizor"
    action:
      - action: remote.send_command
        target:
          entity_id: remote.salon_2
        data:
          command: VOLUME_UP

  CiszejTV:
    speech:
      text: "Ściszam telewizor"
    action:
      - action: remote.send_command
        target:
          entity_id: remote.salon_2
        data:
          command: VOLUME_DOWN

  WyciszTV:
    speech:
      text: "Wyciszam telewizor"
    action:
      - action: remote.send_command
        target:
          entity_id: remote.salon_2
        data:
          command: MUTE

  PokazKamereTV:
    speech:
      text: >-
        {% set cam_names = {
          'podworko': 'podwórza',
          'wejscie': 'wejścia',
          'taras': 'tarasu',
          'ogrod': 'ogrodu',
          'front': 'frontu'
        } %}
        {% if camera_target is defined and camera_target in cam_names %}
          Wyświetlam kamerę {{ cam_names[camera_target] }} na telewizorze
        {% else %}
          Wyświetlam kamerę na telewizorze
        {% endif %}
    action:
      - action: script.tv_show_camera
        data:
          camera: "{{ camera_target | default('podworko') }}"

  ZatrzymajKamereTV:
    speech:
      text: "Zamykam podgląd kamery na telewizorze"
    action:
      - action: script.tv_show_camera
        data:
          camera: stop

  TrybKinoSalon:
    speech:
      text: "Uruchamiam tryb kino w salonie. Przyjemnego seansu!"
    action:
      - action: script.salon_cinema_mode
        data:
          action_type: "on"

  ZatrzymajKinoSalon:
    speech:
      text: "Wyłączam tryb kino"
    action:
      - action: script.salon_cinema_mode
        data:
          action_type: "off"


