# Configure a default setup of Home Assistant (frontend, api, etc)
default_config:

homeassistant:
  # server_port: 8124
  # Name of the location where Home Assistant is running
  name: Dom
  legacy_templates: true
  # external_url: https://w6w7009jc5z6slxn1p84j4a2u3mf4dy1.ui.nabu.casa/
  auth_providers:
    - type: homeassistant
    # - type: trusted_networks
      # trusted_networks:
      #   - 10.20.2.0/24
    #     - 131.96.253.0/24
    # - type: legacy_api_password
    #   api_password: !secret http_password
  # Omitted values in this section will be auto detected using freegeoip.io

  # Location required to calculate the time the sun rises and sets
  latitude: !secret latitude_home
  longitude: !secret longitude_home
  elevation: 322
  # C for Celcius, F for Fahrenheit
  temperature_unit: C
  # Pick yours from here: http://en.wikipedia.org/wiki/List_of_tz_database_time_zones
  time_zone: Europe/Warsaw
  unit_system: metric
  customize: !include customize.yaml
  # customize_glob: !include customize_glob.yaml
  # packages: !include_dir_named packages
  allowlist_external_dirs:
    - /tmp
    - /config/media
    - /config/media/morning_music
  media_dirs:
    local: /config/media
    morning_music: /config/media/morning_music
  
# sensor: !include sensor.yaml
automation: !include automations.yaml
# automations: !include automations.yaml

mqtt: !include mqtt.yaml
scene: !include scenes.yaml
script: !include scripts.yaml
template: !include templates.yaml
rest: !include rest.yaml

shell_command:
  save_deye_inverter_config: >-
    python3 /config/solarman_v5_client.py --set-config --host {{ states('input_text.deye_inverter_ip') }} --port {{ states('input_number.deye_inverter_port') | int(8899) }}
  scan_deye_inverter_ip: >-
    python3 /config/solarman_v5_client.py --scan --save-discovered
  sync_deye_inverter_tou: >-
    python3 /config/pstryk_engine.py --sync-deye-tou --inverter-host {{ states('input_text.deye_inverter_ip') | default('10.20.2.6') }} --inverter-port {{ states('input_number.deye_inverter_port') | int(8899) }} {% if calibration is defined and calibration %}--calibration{% endif %}
  sync_deye_inverter: >-
    python3 /config/pstryk_engine.py --sync-deye-tou --inverter-host {{ states('input_text.deye_inverter_ip') | default('10.20.2.6') }} --inverter-port {{ states('input_number.deye_inverter_port') | int(8899) }}

light:
  - platform: group
    name: "Taras Lampy"
    unique_id: taras_lampy_group
    entities:
      - light.bulb_1
      - light.bulb_2
command_line:
  # Installation: dół (lower/ground floor)
  - sensor:
      name: Pstryk Price Meter Dol
      unique_id: pstryk_price_meter_dol_v1
      command: "python3 /config/pstryk_engine.py --json --installation dol"
      scan_interval: 900
      command_timeout: 45
      unit_of_measurement: "PLN/kWh"
      value_template: >
        {% if value_json.current_price is defined and value_json.current_price is not none %}
          {{ value_json.current_price }}
        {% else %}
          0.0
        {% endif %}
      json_attributes:
        - all_prices
        - debug
        - start
        - end
        - duration_hours
        - average_price
        - display
        - net
        - gross
        - error
        - current
        - today
        - month
        - year
        - installation
        - ev_best_window
        - powerbank_best_window
        - best_sell_window
        - deye_tou_schedule
        - battery_model
  # Installation: góra (upper floor)
  - sensor:
      name: Pstryk Price Meter Gora
      unique_id: pstryk_price_meter_gora_v1
      command: "python3 /config/pstryk_engine.py --json --installation gora"
      scan_interval: 900
      command_timeout: 45
      unit_of_measurement: "PLN/kWh"
      value_template: >
        {% if value_json.current_price is defined and value_json.current_price is not none %}
          {{ value_json.current_price }}
        {% else %}
          0.0
        {% endif %}
      json_attributes:
        - all_prices
        - debug
        - start
        - end
        - duration_hours
        - average_price
        - display
        - net
        - gross
        - error
        - current
        - today
        - month
        - year
        - installation
        - ev_best_window
        - powerbank_best_window
        - best_sell_window
        - deye_tou_schedule
        - battery_model
  # Deye Inverter & Battery Telemetry / Configuration Ingestion (Read-Only)
  - sensor:
      name: Deye Inverter Status
      unique_id: deye_inverter_status_v1
      command: "python3 /config/solarman_v5_client.py --read-all"
      scan_interval: 300
      value_template: >
        {% if value_json.success is defined and value_json.success %}
          online
        {% else %}
          offline
        {% endif %}
      json_attributes:
        - config
        - telemetry
        - active_tou
        - timestamp
        - host
        - port
        - error
  # Deye Inverter Auto-Discovery Scanner
  - sensor:
      name: Deye Inverter Discovered IP
      unique_id: deye_inverter_discovered_ip_v1
      command: "python3 /config/solarman_v5_client.py --scan"
      scan_interval: 86400
      value_template: >
        {% if value_json.found is defined and value_json.found %}
          {{ value_json.ip }}
        {% else %}
          unknown
        {% endif %}
      json_attributes:
        - found
        - ip
        - port
        - scanned_subnet
        - devices
        - duration_seconds

