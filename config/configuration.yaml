# Configure a default setup of Home Assistant (frontend, api, etc)
default_config:

homeassistant:
  # server_port: 8124
  # Name of the location where Home Assistant is running
  name: Dom
  legacy_templates: true
  # external_url: https://w6w7009jc5z6slxn1p84j4a2u3mf4dy1.ui.nabu.casa/
  auth_providers:
    - type: homeassistant
    # - type: trusted_networks
      # trusted_networks:
      #   - 10.20.2.0/24
    #     - 131.96.253.0/24
    # - type: legacy_api_password
    #   api_password: !secret http_password
  # Omitted values in this section will be auto detected using freegeoip.io

  # Location required to calculate the time the sun rises and sets
  latitude: !secret latitude_home
  longitude: !secret longitude_home
  elevation: 322
  # C for Celcius, F for Fahrenheit
  temperature_unit: C
  # Pick yours from here: http://en.wikipedia.org/wiki/List_of_tz_database_time_zones
  time_zone: Europe/Warsaw
  unit_system: metric
  customize: !include customize.yaml
  # customize_glob: !include customize_glob.yaml
  # packages: !include_dir_named packages
  allowlist_external_dirs:
    # - /home/homeAssistant/.homeAssistant/downloads
    - /tmp
    # - /home/homeAssistant/.homeAssistant/downloads/camera/
  media_dirs:
    local: /media
    # recording: /mnt/recordings
  
# sensor: !include sensor.yaml
automation: !include automations.yaml
# automations: !include automations.yaml

mqtt: !include mqtt.yaml
scene: !include scenes.yaml
script: !include scripts.yaml
template: !include templates.yaml

command_line:
  - sensor:
      name: Pstryk Cheapest Window (Direct Script)
      unique_id: pstryk_cheapest_window_direct
      command: !secret pstryk_command
      scan_interval: 3600
      value_template: >
        {% if value_json.error is defined %}
          Error
        {% elif value_json.start is defined %}
          {{ as_timestamp(value_json.start) | timestamp_custom('%H:%M') }} - {{ as_timestamp(value_json.end) | timestamp_custom('%H:%M') }}
        {% else %}
          Unknown
        {% endif %}
      json_attributes:
        - start
        - end
        - duration_hours
        - net
        - gross
        - error

  - sensor:
      name: Pstryk Current Buy Price
      unique_id: pstryk_current_buy_price
      command: !secret pstryk_command
      unit_of_measurement: "PLN/kWh"
      value_template: "{{ value_json.current_price if value_json.current_price is defined else 'unavailable' }}"
      json_attributes:
        - all_prices
        - debug

api:

system_log:
  max_entries: 400

