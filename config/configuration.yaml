switch:
  - platform: template
    switches:
      zasilanie_salon_dodatkowe:
        friendly_name: "Zasilanie Salon Dodatkowe"
        unique_id: zasilanie_salon_dodatkowe
        value_template: "{{ is_state('light.boneio_32_l_07_new_light_18', 'on') }}"
        turn_on:
          action: light.turn_on
          target:
            entity_id: light.boneio_32_l_07_new_light_18
        turn_off:
          action: light.turn_off
          target:
            entity_id: light.boneio_32_l_07_new_light_18
        icon_template: >
          {% if is_state('light.boneio_32_l_07_new_light_18', 'on') %}
            mdi:power-socket-eu
          {% else %}
            mdi:power-socket-eu
          {% endif %}

      zasilanie_sypialnia_garderoba:
        friendly_name: "Zasilanie Sypialnia Garderoba"
        unique_id: zasilanie_sypialnia_garderoba
        value_template: "{{ is_state('light.boneio_32_l_07_new_light_07', 'on') }}"
        turn_on:
          action: light.turn_on
          target:
            entity_id: light.boneio_32_l_07_new_light_07
        turn_off:
          action: light.turn_off
          target:
            entity_id: light.boneio_32_l_07_new_light_07
        icon_template: >
          {% if is_state('light.boneio_32_l_07_new_light_07', 'on') %}
            mdi:power-socket-eu
          {% else %}
            mdi:power-socket-eu
          {% endif %}

      zasilanie_mala_lazienka:
        friendly_name: "Zasilanie Mała Łazienka"
        unique_id: zasilanie_mala_lazienka
        value_template: "{{ is_state('light.boneio_32_l_07_new_light_20', 'on') }}"
        turn_on:
          action: light.turn_on
          target:
            entity_id: light.boneio_32_l_07_new_light_20
        turn_off:
          action: light.turn_off
          target:
            entity_id: light.boneio_32_l_07_new_light_20
        icon_template: >
          {% if is_state('light.boneio_32_l_07_new_light_20', 'on') %}
            mdi:power-socket-eu
          {% else %}
            mdi:power-socket-eu
          {% endif %}

      zasilanie_taras:
        friendly_name: "Zasilanie Taras"
        unique_id: zasilanie_taras
        value_template: "{{ is_state('light.boneio_32_l_07_new_light_11', 'on') }}"
        turn_on:
          action: light.turn_on
          target:
            entity_id: light.boneio_32_l_07_new_light_11
        turn_off:
          action: light.turn_off
          target:
            entity_id: light.boneio_32_l_07_new_light_11
        icon_template: >
          {% if is_state('light.boneio_32_l_07_new_light_11', 'on') %}
            mdi:power-socket-eu
          {% else %}
            mdi:power-socket-eu
          {% endif %}

command_line:
  # Installation: dół (lower/ground floor)
  - sensor:
      name: Pstryk Price Meter Dol
      unique_id: pstryk_price_meter_dol_v1
      command: !secret pstryk_command_dol
      scan_interval: 3600
      unit_of_measurement: "PLN/kWh"
      value_template: >
        {% if value_json.current_price is defined and value_json.current_price is not none %}
          {{ value_json.current_price }}
        {% else %}
          0.0
        {% endif %}
      json_attributes:
        - all_prices
        - debug
        - start
        - end
        - duration_hours
        - net
        - gross
        - error
  # Installation: góra (upper floor)
  - sensor:
      name: Pstryk Price Meter Gora
      unique_id: pstryk_price_meter_gora_v1
      command: !secret pstryk_command_gora
      scan_interval: 3600
      unit_of_measurement: "PLN/kWh"
      value_template: >
        {% if value_json.current_price is defined and value_json.current_price is not none %}
          {{ value_json.current_price }}
        {% else %}
          0.0
        {% endif %}
      json_attributes:
        - all_prices
        - debug
        - start
        - end
        - duration_hours
        - net
        - gross
        - error

