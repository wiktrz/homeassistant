- id: '1754333312816'
  alias: Advanced Bathroom Automation
  description: Handles all bathroom lighting based on door and motion.
  triggers:
  - entity_id: binary_sensor.0b01f72c9c4ac88da803fac8ac530ead
    to: 'on'
    id: door_opened
    trigger: state
  - entity_id: binary_sensor.0b01f72c9c4ac88da803fac8ac530ead
    to: 'off'
    id: door_closed
    trigger: state
  - entity_id: binary_sensor.1ad082b889081e2f5fde537a65b68d51
    to: 'on'
    id: motion_detected
    trigger: state
  - entity_id: binary_sensor.1ad082b889081e2f5fde537a65b68d51
    to: 'off'
    for:
      seconds: 30
    id: motion_cleared
    trigger: state
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: door_opened
      sequence:
      - target:
          entity_id: light.3a972362364e4a2e7b542faad911220c
        data:
          brightness_pct: 20
        action: light.turn_on
    - conditions:
      - condition: trigger
        id: motion_detected
      sequence:
      - target:
          entity_id:
          - light.0b0f4a00d3527380f5a29173cfd229d2
          - light.1896766d22d6ef986f4eeb5fd4ee3a4f
        data:
          brightness_pct: 60
        action: light.turn_on
      - if:
        - condition: state
          entity_id: binary_sensor.0b01f72c9c4ac88da803fac8ac530ead
          state: 'off'
        then:
        - target:
            entity_id: light.3a972362364e4a2e7b542faad911220c
          data:
            brightness_pct: 20
          action: light.turn_on
    - conditions:
      - condition: trigger
        id: motion_cleared
      sequence:
      - target:
          entity_id:
          - light.3a972362364e4a2e7b542faad911220c
          - light.0b0f4a00d3527380f5a29173cfd229d2
          - light.1896766d22d6ef986f4eeb5fd4ee3a4f
        action: light.turn_off
    - conditions:
      - condition: trigger
        id: door_closed
      sequence:
      - delay:
          seconds: 5
      - if:
        - condition: state
          entity_id: binary_sensor.1ad082b889081e2f5fde537a65b68d51
          state: 'off'
        then:
        - target:
            entity_id: light.3a972362364e4a2e7b542faad911220c
          action: light.turn_off
  mode: restart
