- alias: Dimming Lights Down when dark outside
  trigger:
  - platform: numeric_state
    entity_id: sun.sun
    attribute: elevation
    below: -4.0
  action:
  - service: mqtt.publish
    data:
      topic: shellies/shellyrgbw2-814843/color/0/set
      retain: true
      payload: '{"mode":"color","red": 0,"green":0,"blue": 0,"gain": 0,"white": 15,"effect":
        0,"turn":"on"}'
  id: 68d4d324410c46e8a24520c38014613b
- alias: Dimming Lights Up when morning outside
  trigger:
  - platform: numeric_state
    entity_id: sun.sun
    attribute: elevation
    above: -4.0
  action:
  - service: mqtt.publish
    data:
      topic: shellies/shellyrgbw2-814843/color/0/set
      retain: true
      payload: '{"mode":"color","red": 0,"green":0,"blue": 0,"gain": 0,"white": 100,"effect":
        0,"turn":"on"}'
  id: d31bdcaa032d42628e404ca935baa872
- id: 9c3c8f9c510041ec87050e35fc301091
  alias: Dimming Lights Up when morning outside
  triggers:
  - entity_id: sun.sun
    attribute: elevation
    above: 0
    trigger: numeric_state
  actions:
  - data:
      topic: shellies/shellyrgbw2-814843/color/0/set
      payload: '{"mode":"color","red": 0,"green":0,"blue": 0,"gain": 100,"white":
        255,"effect": 0,"turn":"on"}'
    action: mqtt.publish
