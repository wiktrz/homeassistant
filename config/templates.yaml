      unique_id: pstryk_best_window_gora
      state: >
        {% set disp = state_attr('sensor.pstryk_price_meter_gora', 'display') %}
        {% if disp and disp != 'Brak danych' %}
          {{ disp }}
        {% else %}
          {% set start = state_attr('sensor.pstryk_price_meter_gora', 'start') %}
          {% set end = state_attr('sensor.pstryk_price_meter_gora', 'end') %}
          {% set avg = state_attr('sensor.pstryk_price_meter_gora', 'average_price') | default(0, true) %}
          {% if start and end %}
            {{ as_timestamp(start) | timestamp_custom('%H:%M') }} - {{ as_timestamp(end) | timestamp_custom('%H:%M') }} (śr. {{ avg | round(2) }} zł/kWh)
          {% else %}
            unavailable
          {% endif %}
