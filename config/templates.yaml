        {% if start and end %}
          {{ as_timestamp(start, 0) <= as_timestamp(now(), 0) < as_timestamp(end, 0) }}
        {% else %}
          false
        {% endif %}
      icon: >
        {% if is_state('binary_sensor.pstryk_in_sell_window_dol', 'on') %}
          mdi:cash-fast
        {% else %}
          mdi:cash
        {% endif %}

