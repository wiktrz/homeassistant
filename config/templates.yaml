    # --- Dynamic Solar Status & References (Phase 1) ---
    - name: "Dynamic Solar Phase"
      unique_id: dynamic_solar_phase_v1
      icon: mdi:theme-light-dark
      state: >
        {% set elev = state_attr('sun.sun', 'elevation') %}
        {% if elev is not none %}
          {% set elev_f = elev | float(0.0) %}
          {% set rising = state_attr('sun.sun', 'rising') | default(true, true) %}
          {% if elev_f < -18.0 %}
            night
          {% elif elev_f < -12.0 %}
            astronomical_twilight
          {% elif elev_f < -6.0 %}
            nautical_twilight
          {% elif elev_f < -0.833 %}
            {{ 'dawn' if rising else 'dusk' }}
          {% elif elev_f < 6.0 %}
            {{ 'sunrise' if rising else 'golden_hour' }}
          {% else %}
            daylight
          {% endif %}
        {% else %}
          {% set now_str = now().strftime('%H:%M:%S') %}
          {% set dawn = states('input_datetime.dynamic_dawn') | default('06:00:00', true) %}
          {% set sunset = states('input_datetime.dynamic_sunset') | default('18:00:00', true) %}
          {{ 'daylight' if dawn <= now_str < sunset else 'night' }}
        {% endif %}
      attributes:
        elevation: "{{ state_attr('sun.sun', 'elevation') | default(0.0, true) }}"
        azimuth: "{{ state_attr('sun.sun', 'azimuth') | default(0.0, true) }}"
        rising: "{{ state_attr('sun.sun', 'rising') | default(true, true) }}"

    - name: "Dynamic Solar Elevation"
      unique_id: dynamic_solar_elevation_v1
      unit_of_measurement: "°"
      icon: mdi:angle-acute
      state: >
        {% set elev = state_attr('sun.sun', 'elevation') %}
        {{ (elev | float(0.0) | round(2)) if elev is not none else 0.0 }}

    - name: "Dynamic Solar Engine Status"
      unique_id: dynamic_solar_engine_status_v1
      icon: mdi:shield-sun
      state: >
        {% if state_attr('sun.sun', 'elevation') is not none and state_attr('sun.sun', 'next_rising') is not none %}
          ok
        {% elif states('input_datetime.dynamic_dawn') not in ['unavailable', 'unknown', ''] %}
          fallback_helper
        {% else %}
          fallback_static
        {% endif %}
      attributes:
        source: >
          {% if state_attr('sun.sun', 'elevation') is not none and state_attr('sun.sun', 'next_rising') is not none %}
            astral
          {% elif states('input_datetime.dynamic_dawn') not in ['unavailable', 'unknown', ''] %}
            dynamic_helper
          {% else %}
            static_defaults
          {% endif %}
        last_evaluation: "{{ now().isoformat() }}"

