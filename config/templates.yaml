    # --- Dynamic Solar Status & References (Phase 1) ---
    - name: "Dynamic Solar Phase"
      unique_id: dynamic_solar_phase_v1
      icon: mdi:theme-light-dark
      state: >
        {% set elev = state_attr('sun.sun', 'elevation') %}
        {% if elev is not none %}
          {% set elev_f = elev | float(0.0) %}
          {% set rising = state_attr('sun.sun', 'rising') | default(true, true) %}
          {% if elev_f < -18.0 %}
            night
          {% elif elev_f < -12.0 %}
            astronomical_twilight
          {% elif elev_f < -6.0 %}
            nautical_twilight
          {% elif elev_f < -0.833 %}
            {{ 'dawn' if rising else 'dusk' }}
          {% elif elev_f < 6.0 %}
            {{ 'sunrise' if rising else 'golden_hour' }}
          {% else %}
            daylight
          {% endif %}
        {% else %}
          {% set now_str = now().strftime('%H:%M:%S') %}
          {% set dawn = states('input_datetime.dynamic_dawn') if states('input_datetime.dynamic_dawn') not in ['unavailable', 'unknown', ''] else states('input_datetime.pora_switu') | default('06:00:00', true) %}
          {% set sunset = states('input_datetime.dynamic_sunset') if states('input_datetime.dynamic_sunset') not in ['unavailable', 'unknown', ''] else states('input_datetime.pora_zmroku') | default('18:00:00', true) %}
          {{ 'daylight' if dawn <= now_str < sunset else 'night' }}
        {% endif %}
      attributes:
        elevation: "{{ state_attr('sun.sun', 'elevation') | default(0.0, true) }}"
        azimuth: "{{ state_attr('sun.sun', 'azimuth') | default(0.0, true) }}"
        rising: "{{ state_attr('sun.sun', 'rising') | default(true, true) }}"

    - name: "Dynamic Solar Elevation"
      unique_id: dynamic_solar_elevation_v1
      unit_of_measurement: "°"
      icon: mdi:angle-acute
      state: >
        {% set elev = state_attr('sun.sun', 'elevation') %}
        {{ (elev | float(0.0) | round(2)) if elev is not none else 0.0 }}

    - name: "Dynamic Solar Engine Status"
      unique_id: dynamic_solar_engine_status_v1
      icon: mdi:shield-sun
      state: >
        {% if state_attr('sun.sun', 'elevation') is not none and state_attr('sun.sun', 'next_rising') is not none %}
          ok
        {% elif states('input_datetime.dynamic_dawn') not in ['unavailable', 'unknown', ''] or states('input_datetime.pora_switu') not in ['unavailable', 'unknown', ''] %}
          fallback_helper
        {% else %}
          fallback_static
        {% endif %}
      attributes:
        source: >
          {% if state_attr('sun.sun', 'elevation') is not none and state_attr('sun.sun', 'next_rising') is not none %}
            astral
          {% elif states('input_datetime.dynamic_dawn') not in ['unavailable', 'unknown', ''] or states('input_datetime.pora_switu') not in ['unavailable', 'unknown', ''] %}
            existing_helpers
          {% else %}
            static_defaults
          {% endif %}
        last_evaluation: "{{ now().isoformat() }}"

- binary_sensor:
    # --- dół ---
    - name: "Pstryk In Best Window Dol"
      unique_id: pstryk_in_best_window_dol
      state: >
        {% set start = state_attr('sensor.pstryk_best_window_dol', 'start_time') %}
        {% set end = state_attr('sensor.pstryk_best_window_dol', 'end_time') %}
        {% if start and end %}
          {{ as_timestamp(start, 0) <= as_timestamp(now(), 0) < as_timestamp(end, 0) }}
        {% else %}
          false
        {% endif %}
      icon: >
        {% if is_state('binary_sensor.pstryk_in_best_window_dol', 'on') %}
          mdi:flash
        {% else %}
          mdi:flash-outline
        {% endif %}
    # --- góra ---
    - name: "Pstryk In Best Window Gora"
      unique_id: pstryk_in_best_window_gora
      state: >
        {% set start = state_attr('sensor.pstryk_best_window_gora', 'start_time') %}
        {% set end = state_attr('sensor.pstryk_best_window_gora', 'end_time') %}
        {% if start and end %}
          {{ as_timestamp(start, 0) <= as_timestamp(now(), 0) < as_timestamp(end, 0) }}
        {% else %}
          false
        {% endif %}
      icon: >
        {% if is_state('binary_sensor.pstryk_in_best_window_gora', 'on') %}
          mdi:flash
        {% else %}
          mdi:flash-outline
        {% endif %}

    # --- Pstryk Extended Binary Flags: Dół & Góra ---
    - name: "Pstryk Tania Godzina Dol"
      unique_id: pstryk_tania_godzina_dol
      state: >
        {% set curr = state_attr('sensor.pstryk_price_meter_dol', 'current') %}
        {{ curr.is_cheap if curr and curr.is_cheap is defined else false }}
      icon: >
        {% if is_state('binary_sensor.pstryk_tania_godzina_dol', 'on') %}
          mdi:tag-outline
        {% else %}
          mdi:tag-off-outline
        {% endif %}

    - name: "Pstryk Droga Godzina Dol"
      unique_id: pstryk_droga_godzina_dol
      state: >
        {% set curr = state_attr('sensor.pstryk_price_meter_dol', 'current') %}
        {{ curr.is_expensive if curr and curr.is_expensive is defined else false }}
      icon: >
        {% if is_state('binary_sensor.pstryk_droga_godzina_dol', 'on') %}
          mdi:alert-circle-outline
        {% else %}
          mdi:check-circle-outline
        {% endif %}

    - name: "Pstryk Tania Godzina Gora"
      unique_id: pstryk_tania_godzina_gora
      state: >
        {% set curr = state_attr('sensor.pstryk_price_meter_gora', 'current') %}
        {{ curr.is_cheap if curr and curr.is_cheap is defined else false }}
      icon: >
        {% if is_state('binary_sensor.pstryk_tania_godzina_gora', 'on') %}
          mdi:tag-outline
        {% else %}
          mdi:tag-off-outline
        {% endif %}

    - name: "Pstryk Droga Godzina Gora"
      unique_id: pstryk_droga_godzina_gora
      state: >
        {% set curr = state_attr('sensor.pstryk_price_meter_gora', 'current') %}
        {{ curr.is_expensive if curr and curr.is_expensive is defined else false }}
      icon: >
        {% if is_state('binary_sensor.pstryk_droga_godzina_gora', 'on') %}
          mdi:alert-circle-outline
        {% else %}
          mdi:check-circle-outline
        {% endif %}

    # --- Dynamic Solar Flags (Phase 1) ---
    - name: "Dynamic Is Dark Outside"
      unique_id: dynamic_is_dark_outside_v1
      icon: mdi:weather-night
      state: >
        {% set elev = state_attr('sun.sun', 'elevation') %}
        {% if elev is not none %}
          {{ elev | float(0.0) <= -4.0 }}
        {% else %}
          {% set now_str = now().strftime('%H:%M:%S') %}
          {% set dawn = states('input_datetime.dynamic_dawn') if states('input_datetime.dynamic_dawn') not in ['unavailable', 'unknown', ''] else states('input_datetime.pora_switu') | default('06:00:00', true) %}
          {% set outdoor_dusk = states('input_datetime.dynamic_outdoor_dusk') if states('input_datetime.dynamic_outdoor_dusk') not in ['unavailable', 'unknown', ''] else states('input_datetime.pora_zmroku_na_zewnatrz') | default('17:30:00', true) %}
          {{ now_str >= outdoor_dusk or now_str < dawn }}
        {% endif %}

    - name: "Dynamic Is Sun Up"
      unique_id: dynamic_is_sun_up_v1
      icon: mdi:white-balance-sunny
      state: >
        {% set elev = state_attr('sun.sun', 'elevation') %}
        {% if elev is not none %}
          {{ elev | float(0.0) > -0.833 }}
        {% elif is_state('sun.sun', 'above_horizon') %}
          true
        {% elif is_state('sun.sun', 'below_horizon') %}
          false
        {% else %}
          {% set now_str = now().strftime('%H:%M:%S') %}
          {% set dawn = states('input_datetime.dynamic_dawn') if states('input_datetime.dynamic_dawn') not in ['unavailable', 'unknown', ''] else states('input_datetime.pora_switu') | default('06:00:00', true) %}
          {% set sunset = states('input_datetime.dynamic_sunset') if states('input_datetime.dynamic_sunset') not in ['unavailable', 'unknown', ''] else states('input_datetime.pora_zmroku') | default('18:00:00', true) %}
          {{ dawn <= now_str < sunset }}
        {% endif %}

- sensor:
      - name: "Następny wywóz odpadów"
        unique_id: nastepny_wywoz_odpadow
        state: >
          {{ state_attr('calendar.smieci_i_alarmy', 'message') or 'Brak danych' }}
        attributes:
          data: >
            {% set st = state_attr('calendar.smieci_i_alarmy', 'start_time') %}
            {{ as_timestamp(st, 0) | timestamp_custom('%d.%m.%Y') if st else 'N/A' }}
          dni_pozostalo: >
            {% set st = state_attr('calendar.smieci_i_alarmy', 'start_time') %}
            {% if st %}
              {{ ((as_timestamp(st, 0) - as_timestamp(now(), 0)) / 86400) | int + 1 }}
            {% else %}
              0
            {% endif %}
          kolor: >
            {% set msg = (state_attr('calendar.smieci_i_alarmy', 'message') or '') | lower %}
            {% if 'niesegregowane' in msg %} grey
            {% elif 'bio' in msg %} brown
            {% elif 'plastik' in msg %} yellow
            {% elif 'szkło' in msg %} green
            {% elif 'papier' in msg %} blue
            {% else %} white
            {% endif %}
        icon: "mdi:trash-can"

