      icon: >
        {% if is_state('binary_sensor.pstryk_in_best_window_gora', 'on') %}
          mdi:flash
        {% else %}
          mdi:flash-outline
        {% endif %}

    # --- Pstryk Extended Binary Flags: Dół & Góra ---
    - name: "Pstryk Tania Godzina Dol"
      unique_id: pstryk_tania_godzina_dol
      state: >
        {% set curr = state_attr('sensor.pstryk_price_meter_dol', 'current') %}
        {{ curr.is_cheap if curr and curr.is_cheap is defined else false }}
      icon: >
        {% if is_state('binary_sensor.pstryk_tania_godzina_dol', 'on') %}
          mdi:tag-outline
        {% else %}
          mdi:tag-off-outline
        {% endif %}

    - name: "Pstryk Droga Godzina Dol"
      unique_id: pstryk_droga_godzina_dol
      state: >
        {% set curr = state_attr('sensor.pstryk_price_meter_dol', 'current') %}
        {{ curr.is_expensive if curr and curr.is_expensive is defined else false }}
      icon: >
        {% if is_state('binary_sensor.pstryk_droga_godzina_dol', 'on') %}
          mdi:alert-circle-outline
        {% else %}
          mdi:check-circle-outline
        {% endif %}

    - name: "Pstryk Tania Godzina Gora"
      unique_id: pstryk_tania_godzina_gora
      state: >
        {% set curr = state_attr('sensor.pstryk_price_meter_gora', 'current') %}
        {{ curr.is_cheap if curr and curr.is_cheap is defined else false }}
      icon: >
        {% if is_state('binary_sensor.pstryk_tania_godzina_gora', 'on') %}
