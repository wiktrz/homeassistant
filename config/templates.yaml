        {% endif %}

    # --- Dynamic Solar Flags (Phase 1) ---
    - name: "Dynamic Is Dark Outside"
      unique_id: dynamic_is_dark_outside_v1
      icon: mdi:weather-night
      state: >
        {% set elev = state_attr('sun.sun', 'elevation') %}
        {% if elev is not none %}
          {{ elev | float(0.0) <= -4.0 }}
        {% else %}
          {% set now_str = now().strftime('%H:%M:%S') %}
          {% set dawn = states('input_datetime.dynamic_dawn') | default('06:00:00', true) %}
          {% set outdoor_dusk = states('input_datetime.dynamic_outdoor_dusk') | default('17:30:00', true) %}
          {{ now_str >= outdoor_dusk or now_str < dawn }}
        {% endif %}

    - name: "Dynamic Is Sun Up"
      unique_id: dynamic_is_sun_up_v1
      icon: mdi:white-balance-sunny
      state: >
        {% set elev = state_attr('sun.sun', 'elevation') %}
        {% if elev is not none %}
          {{ elev | float(0.0) > -0.833 }}
        {% elif is_state('sun.sun', 'above_horizon') %}
          true
        {% elif is_state('sun.sun', 'below_horizon') %}
          false
        {% else %}
          {% set now_str = now().strftime('%H:%M:%S') %}
          {% set dawn = states('input_datetime.dynamic_dawn') | default('06:00:00', true) %}
          {% set sunset = states('input_datetime.dynamic_sunset') | default('18:00:00', true) %}
          {{ dawn <= now_str < sunset }}
        {% endif %}

