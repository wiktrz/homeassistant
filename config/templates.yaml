    # --- Deye 12kW & SunDeposit 16.13 kWh Battery Model ---
    - name: "Deye Battery Operating Capacity kWh"
      unique_id: deye_battery_operating_capacity_kwh
      unit_of_measurement: "kWh"
      state: >
        {% set cfg = state_attr('sensor.deye_inverter_status', 'config') %}
        {% set max_soc = cfg.max_charge_soc if cfg and cfg.max_charge_soc is defined else (states('input_number.deye_battery_max_charge_soc') | default('90', true) | float(90)) %}
        {% set min_soc = cfg.min_discharge_soc if cfg and cfg.min_discharge_soc is defined else (states('input_number.deye_battery_min_discharge_soc') | default('20', true) | float(20)) %}
        {% set cap = states('input_number.powerbank_total_capacity_kwh') | default('16.13', true) | float(16.13) %}
        {{ (((max_soc - min_soc) / 100.0) * cap) | round(2) }}
      icon: mdi:battery-heart

    - name: "Deye Battery Blackout Reserve kWh"
      unique_id: deye_battery_blackout_reserve_kwh
      unit_of_measurement: "kWh"
      state: >
        {% set cfg = state_attr('sensor.deye_inverter_status', 'config') %}
        {% set min_soc = cfg.min_discharge_soc if cfg and cfg.min_discharge_soc is defined else (states('input_number.deye_battery_min_discharge_soc') | default('20', true) | float(20)) %}
        {% set shut_soc = cfg.shutdown_soc if cfg and cfg.shutdown_soc is defined else (states('input_number.deye_battery_shutdown_soc') | default('5', true) | float(5)) %}
        {% set cap = states('input_number.powerbank_total_capacity_kwh') | default('16.13', true) | float(16.13) %}
        {{ (((min_soc - shut_soc) / 100.0) * cap) | round(2) }}
      icon: mdi:battery-alert

    - name: "Deye Charge Power kW"
      unique_id: deye_charge_power_kw
      unit_of_measurement: "kW"
      state: >
        {% set cfg = state_attr('sensor.deye_inverter_status', 'config') %}
        {% set volt = states('input_number.powerbank_voltage_v') | default('51.2', true) | float(51.2) %}
        {% set curr = cfg.max_charge_current if cfg and cfg.max_charge_current is defined else (states('input_number.powerbank_charge_current_a') | default('100', true) | float(100)) %}
        {{ ((volt * curr) / 1000.0) | round(2) }}
      icon: mdi:transmission-tower-import

    - name: "Deye Discharge Power kW"
      unique_id: deye_discharge_power_kw
      unit_of_measurement: "kW"
      state: >
        {% set cfg = state_attr('sensor.deye_inverter_status', 'config') %}
        {% set volt = states('input_number.powerbank_voltage_v') | default('51.2', true) | float(51.2) %}
        {% set curr = cfg.max_discharge_current if cfg and cfg.max_discharge_current is defined else (states('input_number.powerbank_discharge_current_a') | default('100', true) | float(100)) %}
        {{ ((volt * curr) / 1000.0) | round(2) }}
      icon: mdi:transmission-tower-export

    - name: "Deye Battery Display Level"
      unique_id: deye_battery_display_level
      state: >
        {% set soc = states('sensor.deye_battery_soc') %}
        {% set cap = states('input_number.powerbank_total_capacity_kwh') | default('16.13', true) | float(16.13) %}
        {% if soc not in ['unavailable', 'unknown', ''] %}
          {% set soc_f = soc | float(0) %}
          {% set kwh = ((soc_f / 100.0) * cap) | round(1) %}
          {{ soc_f | int }}% ({{ kwh }} kWh)
        {% else %}
          {% set max_soc = states('input_number.deye_battery_max_charge_soc') | default('90', true) | float(90) %}
          {% set kwh = ((max_soc / 100.0) * cap) | round(1) %}
          {{ max_soc | int }}% ({{ kwh }} kWh)
        {% endif %}
      icon: >
        {% set soc = states('sensor.deye_battery_soc') %}
        {% set s = (soc | float(90)) if soc not in ['unavailable', 'unknown', ''] else 90 %}
        {% if s >= 90 %}
          mdi:battery
        {% elif s >= 70 %}
          mdi:battery-80
        {% elif s >= 50 %}
          mdi:battery-50
        {% elif s >= 20 %}
          mdi:battery-20
        {% else %}
          mdi:battery-alert
        {% endif %}

    - name: "Deye Battery Working State"
      unique_id: deye_battery_working_state
      state: >
        {% if is_state('binary_sensor.pstryk_in_powerbank_best_window_dol', 'on') %}
          Ładowanie
        {% elif is_state('binary_sensor.pstryk_in_sell_window_dol', 'on') %}
          Rozładowanie (Sprzedaż)
        {% else %}
          Czuwanie
        {% endif %}
      icon: >
        {% set st = states('sensor.deye_battery_working_state') %}
        {% if st == 'Ładowanie' %}
          mdi:battery-charging
        {% elif st == 'Rozładowanie (Sprzedaż)' %}
          mdi:battery-arrow-down
        {% else %}
          mdi:battery
        {% endif %}

    - name: "Deye Battery Days Since Calibration"
      unique_id: deye_battery_days_since_calibration
      state: >
        {% set last = states('input_datetime.deye_battery_last_calibration_date') %}
        {% if last not in ['unavailable', 'unknown', ''] %}
          {% set last_ts = as_timestamp(last) %}
          {% if last_ts %}
            {{ ((as_timestamp(now()) - last_ts) / 86400) | int }}
          {% else %}
            0
          {% endif %}
        {% else %}
          0
        {% endif %}
      unit_of_measurement: "dni"
      icon: mdi:calendar-clock

- binary_sensor:
    # --- Pstryk Dispatch Binary Triggers ---
    - name: "Pstryk In EV Best Window Dol"
      unique_id: pstryk_in_ev_best_window_dol
      state: >
        {% set start = state_attr('sensor.pstryk_ev_best_window_dol', 'start') %}
        {% set end = state_attr('sensor.pstryk_ev_best_window_dol', 'end') %}
        {% if start and end %}
          {{ as_timestamp(start, 0) <= as_timestamp(now(), 0) < as_timestamp(end, 0) }}
        {% else %}
          false
        {% endif %}
      icon: >
        {% if is_state('binary_sensor.pstryk_in_ev_best_window_dol', 'on') %}
          mdi:car-electric
        {% else %}
          mdi:car
        {% endif %}

    - name: "Pstryk In Powerbank Best Window Dol"
      unique_id: pstryk_in_powerbank_best_window_dol
      state: >
        {% set slots = state_attr('sensor.pstryk_powerbank_best_window_dol', 'slots') %}
        {% set start = state_attr('sensor.pstryk_powerbank_best_window_dol', 'start') %}
        {% set end = state_attr('sensor.pstryk_powerbank_best_window_dol', 'end') %}
        {% if is_state_attr('sensor.pstryk_powerbank_best_window_dol', 'is_consecutive', true) and start and end %}
          {{ as_timestamp(start, 0) <= as_timestamp(now(), 0) < as_timestamp(end, 0) }}
        {% elif slots is defined and slots is iterable and slots | length > 0 %}
          {% set now_hm = now().strftime('%H:%M') %}
          {% set ns = namespace(active=false) %}
          {% for s in slots %}
            {% set parts = s.split(' - ') %}
            {% if parts | length == 2 %}
              {% if parts[0] <= now_hm < parts[1] %}
                {% set ns.active = true %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ ns.active }}
        {% elif start and end %}
          {{ as_timestamp(start, 0) <= as_timestamp(now(), 0) < as_timestamp(end, 0) }}
        {% else %}
          false
        {% endif %}
      icon: >
        {% if is_state('binary_sensor.pstryk_in_powerbank_best_window_dol', 'on') %}
          mdi:battery-charging
        {% else %}
          mdi:battery
        {% endif %}

