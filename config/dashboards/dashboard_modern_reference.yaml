  - title: Energia
    path: energia
    icon: mdi:transmission-tower
    cards:
      - type: button
        name: Szczegółowy Raport i Historia Zużycia
        icon: mdi:chart-timeline-variant
        tap_action:
          action: navigate
          navigation_path: /dashboard-home/energia-raport
      - type: heading
        heading: Harmonogram Dyspozytorski Pstryk
      - type: entities
        title: Rekomendowane Okna Dyspozytorskie & Status
        show_header_toggle: false
        entities:
          - entity: sensor.pstryk_ev_best_window_dol
            name: Okno Ładowania Samochodu (EV)
            icon: mdi:car-electric
          - entity: sensor.pstryk_powerbank_best_window_dol
            name: Okno Ładowania Magazynu Energii
            icon: mdi:battery-charging
          - entity: sensor.pstryk_best_sell_window_dol
            name: Szczyt Cenowy (Zasilanie z Baterii)
            icon: mdi:battery-arrow-down
          - type: section
            label: Aktywny Stan Okien Dyspozytorskich
          - entity: binary_sensor.pstryk_in_ev_best_window_dol
            name: Trwa Okno Ładowania Samochodu (EV)
            icon: mdi:car-electric
          - entity: binary_sensor.pstryk_in_powerbank_best_window_dol
            name: Trwa Okno Ładowania Magazynu Energii
            icon: mdi:battery-charging
          - entity: binary_sensor.pstryk_in_sell_window_dol
            name: Trwa Szczyt Cenowy (Zasilanie Domu z Baterii)
            icon: mdi:battery-arrow-down
      - type: heading
        heading: Magazyn Energii & Falownik Deye 12 kW
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: sensor.deye_battery_display_level
            name: Poziom Baterii
            icon: mdi:battery-high
            color: green
          - type: tile
            entity: sensor.deye_battery_working_state
            name: Tryb Pracy Magazynu
            icon: mdi:battery-sync
            color: blue
          - type: tile
            entity: sensor.deye_battery_operating_capacity_kwh
            name: Pojemność Użyteczna
            icon: mdi:battery-heart-variant
            color: teal
          - type: tile
            entity: sensor.deye_battery_blackout_reserve_kwh
            name: Rezerwa Blackout
            icon: mdi:battery-alert
            color: red
          - type: tile
            entity: sensor.deye_charge_power_kw
            name: Max Moc Ładowania
            icon: mdi:transmission-tower-import
            color: purple
          - type: tile
            entity: sensor.deye_discharge_power_kw
            name: Max Moc Oddawania
            icon: mdi:transmission-tower-export
            color: amber
      - type: entities
        title: Parametry Odczytane z Falownika Deye (Modbus Read-Only)
        show_header_toggle: false
        entities:
          - entity: sensor.deye_inverter_status
            name: Status Połączenia z Falownikiem
            icon: mdi:lan-connect
          - entity: input_text.deye_inverter_ip
            name: Adres IP Falownika
            icon: mdi:ip-network
          - entity: input_number.deye_inverter_port
            name: Port Falownika (Solarman V5)
            icon: mdi:ethernet
          - entity: input_button.scan_deye_inverter_ip
            name: Skanuj Sieć LAN i Wykryj Falownik
            icon: mdi:radar
          - entity: sensor.deye_inverter_max_charge_soc
            name: Górny Limit Ładowania (Max SOC - Reg 112)
            icon: mdi:battery-arrow-up
          - entity: sensor.deye_inverter_min_discharge_soc
            name: Dolny Limit Rozładowania (Min SOC - Reg 110)
            icon: mdi:battery-arrow-down
          - entity: sensor.deye_inverter_shutdown_soc
            name: Próg Wyłączenia (Shutdown SOC - Reg 111)
            icon: mdi:battery-alert
          - entity: sensor.deye_inverter_max_charge_current
            name: Max Prąd Ładowania (Reg 108)
            icon: mdi:current-dc
          - entity: sensor.deye_inverter_max_discharge_current
            name: Max Prąd Rozładowania (Reg 109)
            icon: mdi:current-dc
          - entity: sensor.deye_battery_voltage
            name: Napięcie Magazynu (Reg 587)
            icon: mdi:sine-wave
          - entity: sensor.deye_battery_current
            name: Prąd Pracy Magazynu (Reg 591)
            icon: mdi:flash
          - entity: script.refresh_deye_inverter_status
            name: Wymuś Odczyt Telemetrii z Falownika
            icon: mdi:refresh
      - type: conditional
        conditions:
          - entity: binary_sensor.deye_battery_critical_parameters_pending
            state: "on"
          - entity: binary_sensor.ui_op_pending_deye_battery_safety
            state: "off"
        card:
          type: vertical-stack
          cards:
            - type: markdown
              title: ⚠️ Oczekuje na Zatwierdzenie Zmiany Progów Baterii
              content: |-
                Wykryto zmianę progów na suwakach, która **nie została jeszcze wysłana** do falownika Deye:
                * **Min SOC (Batt LOW):** `{{ state_attr('binary_sensor.deye_battery_critical_parameters_pending', 'inverter_min_soc') }}` ➔ **`{{ state_attr('binary_sensor.deye_battery_critical_parameters_pending', 'pending_min_soc') }}`**
                * **Shutdown SOC:** `{{ state_attr('binary_sensor.deye_battery_critical_parameters_pending', 'inverter_shutdown_soc') }}` ➔ **`{{ state_attr('binary_sensor.deye_battery_critical_parameters_pending', 'pending_shutdown_soc') }}`**

                *Wybierz działanie poniżej. Zmiany nie zostaną zapisane bez Twojego potwierdzenia.*
            - type: horizontal-stack
              cards:
                - type: button
                  name: Zatwierdź i Zastosuj
                  icon: mdi:check-decagram
                  tap_action:
                    action: call-service
                    service: script.confirm_and_apply_deye_battery_settings
                    confirmation:
                      text: "Czy na pewno chcesz zatwierdzić zmianę progów baterii i przesłać nowy harmonogram do falownika Deye?"
                - type: button
                  name: Cofnij do Falownika
                  icon: mdi:undo-variant
                  tap_action:
                    action: call-service
                    service: script.revert_deye_battery_settings_from_inverter
      - type: conditional
        conditions:
          - entity: binary_sensor.ui_op_pending_deye_battery_safety
            state: "on"
        card:
          type: entities
          title: Harmonogram Time-of-Use & Parametry Baterii (Zablokowane)
          show_header_toggle: false
          entities:
            - type: section
              label: ⏳ Trwa Zapis do Falownika Deye (Edycja Zablokowana)
            - entity: sensor.deye_tou_active_schedule
              name: Status Harmonogramu TOU (Reg 248)
              icon: mdi:calendar-clock
            - entity: input_datetime.deye_tou_last_synced_date
              name: Data Ostatniej Synchronizacji TOU
              icon: mdi:calendar-sync
      - type: conditional
        conditions:
          - entity: binary_sensor.ui_op_pending_deye_battery_safety
            state: "off"
        card:
          type: entities
          title: Harmonogram Time-of-Use & Parametry Baterii
          show_header_toggle: false
          entities:
            - entity: sensor.deye_tou_active_schedule
              name: Status Harmonogramu TOU (Reg 248)
              icon: mdi:calendar-clock
            - entity: input_datetime.deye_tou_last_synced_date
              name: Data Ostatniej Synchronizacji TOU
              icon: mdi:calendar-sync
            - type: section
              label: Parametry Dyspozycji (Suwaki Edytowalne)
            - entity: input_boolean.deye_battery_installed
              name: Magazyn Energii Zainstalowany
              icon: mdi:battery-plus-variant
            - entity: input_number.deye_battery_max_charge_soc
              name: Docelowy Max SOC Ładowania (Suwak)
              icon: mdi:battery-arrow-up
            - entity: input_number.deye_pre_peak_margin_pct
              name: Margines Rezerwy Przed Szczytem (+%)
              icon: mdi:battery-clock
            - entity: input_number.deye_battery_min_discharge_soc
              name: Min SOC Praca w Sieci (Batt LOW)
              icon: mdi:battery-arrow-down
            - entity: input_number.deye_battery_shutdown_soc
              name: Shutdown SOC (Blackout)
              icon: mdi:battery-alert
            - type: section
              label: Sterowanie Ręczne
            - entity: input_select.ev_charging_target_hours
              name: Długość Okna Ładowania EV
              icon: mdi:car-electric
            - entity: input_select.battery_discharge_target_hours
              name: Długość Szczytu Cenowego (Bateria)
              icon: mdi:battery-arrow-up
            - entity: input_button.sync_deye_inverter_soc
              name: Wymuś Przeliczenie i Zapis TOU Teraz
              icon: mdi:cloud-sync
      - type: markdown
        title: Aktywne Sloty Falownika Deye (Time-of-Use) — Dziś
        content: |-
          {% set nom_v = states('sensor.powerbank_voltage_v') | float(0.0) %}
          {% set active = state_attr('sensor.deye_inverter_status', 'active_tou') %}
          {% set slots = active['slots'] if active and active['slots'] is defined else (state_attr('sensor.deye_tou_active_schedule', 'slots') if state_attr('sensor.deye_tou_active_schedule', 'slots') is defined else []) %}
          {% set planned_a = states('sensor.deye_inverter_recommended_charge_current') if states('sensor.deye_inverter_recommended_charge_current') not in ['unknown', 'unavailable', ''] else (states('sensor.deye_inverter_max_charge_current') if states('sensor.deye_inverter_max_charge_current') not in ['unknown', 'unavailable', ''] else '-') %}
          {% set active_a = states('sensor.deye_inverter_max_charge_current') if states('sensor.deye_inverter_max_charge_current') not in ['unknown', 'unavailable', ''] else '-' %}
          {% if slots and slots | length == 6 -%}
          > ⚡ **Planowany Prąd Ładowania:** `{{ planned_a }}{% if planned_a != '-' %} A{% endif %}` &nbsp;|&nbsp; 🔌 **Deye Reg 108 (Aktualny w Falowniku):** `{{ active_a }}{% if active_a != '-' %} A{% endif %}`

          | Slot | Godzina | Tryb / Prąd / Moc | Cel SOC | Sieć | Opis Działania |
          |:---:|:---:|:---|:---:|:---:|:---|
          {% for s in slots -%}
          | **{{ s.slot }}** | `{{ s.time }}` | {% if s.grid_charge %}**⚡ Ładowanie: {{ s.target_charge_current_a if s.target_charge_current_a is defined and s.target_charge_current_a is not none else (s.charge_current_a if s.charge_current_a is defined and s.charge_current_a is not none else planned_a) }}{% if (s.target_charge_current_a if s.target_charge_current_a is defined and s.target_charge_current_a is not none else (s.charge_current_a if s.charge_current_a is defined and s.charge_current_a is not none else planned_a)) != '-' %} A{% endif %}**{% else %}Oddawanie: {{ s.display_power_w if s.display_power_w is defined and s.display_power_w is not none else (s.power_w if s.power_w is defined else 7170) }} W (~{{ s.display_current_a if s.display_current_a is defined and s.display_current_a is not none else (s.discharge_current_a if s.discharge_current_a is defined and s.discharge_current_a is not none else (((s.power_w if s.power_w is defined else 7170) / (nom_v if nom_v > 0 else 51.2)) | round(0))) }} A){% endif %} | {{ s.target_soc }}% | {{ '**⚡ TAK**' if s.grid_charge else 'NIE' }} | {{ s.label if s.label else ('Najtańsze Ładowanie' if s.grid_charge else ('Czuwanie Przed Szczytem' if s.target_soc >= 80 else 'Autokonsumpcja PV')) }} |
          {% endfor %}

          ---

          ### 🔮 Prognoza Dyspozytorska na Jutro *(publikacja ok. 12:00)*

          {% if is_state('binary_sensor.pstryk_has_tomorrow_pricing_dol', 'on') -%}
          > 🚗 **Okno EV (Samochód):** `{{ states('sensor.pstryk_ev_best_window_tomorrow_dol') }}`  
          > 🔋 **Magazyn Energii (Ładowanie):** `{{ states('sensor.pstryk_powerbank_best_window_tomorrow_dol') }}`  
          > ⚡ **Szczyt Cenowy (Sprzedaż / Bateria):** `{{ states('sensor.pstryk_best_sell_window_tomorrow_dol') }}`

          {% set tom_slots = state_attr('sensor.pstryk_price_meter_dol', 'deye_tou_schedule_tomorrow') %}
          {% if tom_slots and tom_slots | length == 6 -%}
          | Slot | Godzina | Tryb / Prąd / Moc | Cel SOC | Sieć | Opis Działania |
          |:---:|:---:|:---|:---:|:---:|:---|
          {% for st in tom_slots -%}
          | **{{ st.slot }}** | `{{ st.time }}` | {% if st.grid_charge %}**⚡ Ładowanie: {{ st.target_charge_current_a if st.target_charge_current_a is defined and st.target_charge_current_a is not none else (st.charge_current_a if st.charge_current_a is defined and st.charge_current_a is not none else planned_a) }}{% if (st.target_charge_current_a if st.target_charge_current_a is defined and st.target_charge_current_a is not none else (st.charge_current_a if st.charge_current_a is defined and st.charge_current_a is not none else planned_a)) != '-' %} A{% endif %}**{% else %}Oddawanie: {{ st.display_power_w if st.display_power_w is defined and st.display_power_w is not none else (st.power_w if st.power_w is defined else 7170) }} W (~{{ st.display_current_a if st.display_current_a is defined and st.display_current_a is not none else (st.discharge_current_a if st.discharge_current_a is defined and st.discharge_current_a is not none else (((st.power_w if st.power_w is defined else 7170) / (nom_v if nom_v > 0 else 51.2)) | round(0))) }} A){% endif %} | {{ st.target_soc }}% | {{ '**⚡ TAK**' if st.grid_charge else 'NIE' }} | {{ st.label if st.label else ('Najtańsze Ładowanie' if st.grid_charge else 'Autokonsumpcja PV') }} |
          {% endfor %}
          {%- endif %}
          {%- else -%}
          > *⏳ Oczekiwanie na publikację cen na jutro przez TGE/Pstryk (ok. 12:00–14:00)...*
          {%- endif %}
          {% else -%}
          *⏳ Oczekiwanie na synchronizację z falownikiem Deye...*
          {% endif %}
