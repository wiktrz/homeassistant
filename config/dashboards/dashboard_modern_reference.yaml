                    * **Min SOC (Batt LOW):** `{{ state_attr('binary_sensor.deye_battery_critical_parameters_pending', 'inverter_min_soc') }}` ➔ **`{{ state_attr('binary_sensor.deye_battery_critical_parameters_pending', 'pending_min_soc') }}`**
                    * **Shutdown SOC:** `{{ state_attr('binary_sensor.deye_battery_critical_parameters_pending', 'inverter_shutdown_soc') }}` ➔ **`{{ state_attr('binary_sensor.deye_battery_critical_parameters_pending', 'pending_shutdown_soc') }}`**

