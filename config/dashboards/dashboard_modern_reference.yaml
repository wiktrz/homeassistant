  - title: Raport Energii
    path: energia-raport
    subview: true
    icon: mdi:chart-timeline-variant
    cards:
      - type: heading
        heading: Raport Zużycia i Kosztów Energii (Pstryk)
      - type: heading
        heading: Porównanie Instalacji (Dół vs Góra)
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: sensor.pstryk_zuzycie_dzis_dol
            name: Dół — Dziś (kWh)
            icon: mdi:lightning-bolt
            color: blue
          - type: tile
            entity: sensor.pstryk_koszt_dzis_dol
            name: Dół — Dziś (PLN)
            icon: mdi:cash
            color: amber
          - type: tile
            entity: sensor.pstryk_zuzycie_dzis_gora
            name: Góra — Dziś (kWh)
            icon: mdi:lightning-bolt
            color: blue
          - type: tile
            entity: sensor.pstryk_koszt_dzis_gora
            name: Góra — Dziś (PLN)
            icon: mdi:cash
            color: amber
          - type: tile
            entity: sensor.pstryk_zuzycie_miesiac_dol
            name: Dół — Miesiąc (kWh)
            icon: mdi:calendar-month
            color: indigo
          - type: tile
            entity: sensor.pstryk_koszt_miesiac_dol
            name: Dół — Miesiąc (PLN)
            icon: mdi:wallet
            color: deep-orange
          - type: tile
            entity: sensor.pstryk_zuzycie_miesiac_gora
            name: Góra — Miesiąc (kWh)
            icon: mdi:calendar-month
            color: indigo
          - type: tile
            entity: sensor.pstryk_koszt_miesiac_gora
            name: Góra — Miesiąc (PLN)
            icon: mdi:wallet
            color: deep-orange
      - type: markdown
        title: Podsumowanie Zbiorcze
        content: |
          | Okres | Instalacja Dół | Instalacja Góra | Łącznie (Dom) |
          | :--- | :---: | :---: | :---: |
          | **Dziś** | {{ states('sensor.pstryk_zuzycie_dzis_dol') }} kWh<br>({{ states('sensor.pstryk_koszt_dzis_dol') }} zł) | {{ states('sensor.pstryk_zuzycie_dzis_gora') }} kWh<br>({{ states('sensor.pstryk_koszt_dzis_gora') }} zł) | **{{ ((states('sensor.pstryk_zuzycie_dzis_dol') | float(0)) + (states('sensor.pstryk_zuzycie_dzis_gora') | float(0))) | round(2) }} kWh**<br>({{ ((states('sensor.pstryk_koszt_dzis_dol') | float(0)) + (states('sensor.pstryk_koszt_dzis_gora') | float(0))) | round(2) }} zł) |
          | **Ten Miesiąc** | {{ states('sensor.pstryk_zuzycie_miesiac_dol') }} kWh<br>({{ states('sensor.pstryk_koszt_miesiac_dol') }} zł) | {{ states('sensor.pstryk_zuzycie_miesiac_gora') }} kWh<br>({{ states('sensor.pstryk_koszt_miesiac_gora') }} zł) | **{{ ((states('sensor.pstryk_zuzycie_miesiac_dol') | float(0)) + (states('sensor.pstryk_zuzycie_miesiac_gora') | float(0))) | round(2) }} kWh**<br>({{ ((states('sensor.pstryk_koszt_miesiac_dol') | float(0)) + (states('sensor.pstryk_koszt_miesiac_gora') | float(0))) | round(2) }} zł) |

      - type: heading
        heading: Dziś — Rozkład Godzinowy (Pstryk)

      - type: markdown
        title: Szczegółowy Rozkład Godzinowy
        content: |
          | Godzina | Stawka | Instalacja Dół | Instalacja Góra |
          | :---: | :---: | :---: | :---: |
          {% set rows_dol = state_attr('sensor.pstryk_zuzycie_dzis_dol', 'hourly') %}
          {% set rows_gora = state_attr('sensor.pstryk_zuzycie_dzis_gora', 'hourly') %}
          {% if rows_dol and rows_dol | length > 0 %}
          {% for r in rows_dol %}
          {% set g = rows_gora[loop.index0] if rows_gora and loop.index0 < (rows_gora | length) else none %}
          | {{ r.start }} - {{ r.end }} | {{ r.rate_gross }} zł | {{ r.kwh }} kWh ({{ r.cost_pln }} zł) | {{ g.kwh if g else '-' }} kWh ({{ g.cost_pln if g else '-' }} zł) |
          {% endfor %}
          {% else %}
          | - | Brak danych godzinowych | - | - |
          {% endif %}

      - type: heading
        heading: Ten Miesiąc — Historia Dzienna

      - type: markdown
        title: Dzienny Rozkład Zużycia w Bieżącym Miesiącu
        content: |
          | Data | Śr. Stawka | Instalacja Dół | Instalacja Góra |
          | :---: | :---: | :---: | :---: |
          {% set days_dol = state_attr('sensor.pstryk_zuzycie_miesiac_dol', 'daily') %}
          {% set days_gora = state_attr('sensor.pstryk_zuzycie_miesiac_gora', 'daily') %}
          {% if days_dol and days_dol | length > 0 %}
          {% for d in days_dol %}
          {% set dg = days_gora[loop.index0] if days_gora and loop.index0 < (days_gora | length) else none %}
          | {{ d.date }} | {{ d.avg_rate }} zł | {{ d.kwh }} kWh ({{ d.cost_pln }} zł) | {{ dg.kwh if dg else '-' }} kWh ({{ dg.cost_pln if dg else '-' }} zł) |
          {% endfor %}
          {% else %}
          | - | Brak danych dziennych | - | - |
          {% endif %}

      - type: heading
        heading: Rok 2026 — Historia Miesięczna

      - type: markdown
        title: Miesięczna Historia Kosztów i Zużycia
        content: |
          | Miesiąc | Instalacja Dół | Instalacja Góra | Łącznie (Dom) |
          | :---: | :---: | :---: | :---: |
          {% set months_dol = state_attr('sensor.pstryk_koszt_miesiac_dol', 'monthly') or state_attr('sensor.pstryk_koszt_miesiac_dol', 'monthly_history') %}
          {% set months_gora = state_attr('sensor.pstryk_koszt_miesiac_gora', 'monthly') or state_attr('sensor.pstryk_koszt_miesiac_gora', 'monthly_history') %}
          {% if months_dol and months_dol | length > 0 %}
          {% for m in months_dol %}
          {% set mg = months_gora[loop.index0] if months_gora and loop.index0 < (months_gora | length) else none %}
          {% set total_cost = ((m.cost_pln | float(0)) + (mg.cost_pln | float(0) if mg else 0)) | round(2) %}
          | {{ m.month }} | {{ m.kwh }} kWh ({{ m.cost_pln }} zł) | {{ mg.kwh if mg else '-' }} kWh ({{ mg.cost_pln if mg else '-' }} zł) | **{{ total_cost }} zł** |
          {% endfor %}
          {% else %}
          | - | Brak danych miesięcznych | - | - |
          {% endif %}
      - type: heading
        heading: Wykresy i Trendy Cenowe
      - type: history-graph
        title: Historia Cen Energii (PLN/kWh)
        hours_to_show: 48
        entities:
          - entity: sensor.pstryk_cena_kupno_dol
            name: Kupno Dół
          - entity: sensor.pstryk_cena_kupno_gora
            name: Kupno Góra
          - entity: sensor.pstryk_cena_sprzedaz_dol
            name: Sprzedaż Dół
          - entity: sensor.pstryk_cena_sprzedaz_gora
            name: Sprzedaż Góra
      - type: history-graph
        title: Zużycie Energii (kWh)
        hours_to_show: 48
        entities:
          - entity: sensor.pstryk_zuzycie_dzis_dol
            name: Zużycie Dziś Dół
          - entity: sensor.pstryk_zuzycie_dzis_gora
            name: Zużycie Dziś Góra
          - entity: sensor.pstryk_koszt_dzis_dol
            name: Koszt Dziś Dół
          - entity: sensor.pstryk_koszt_dzis_gora
            name: Koszt Dziś Góra
