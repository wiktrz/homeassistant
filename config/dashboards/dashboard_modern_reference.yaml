title: Dom iPad Modern
views:
  - title: Dom
    path: dom
    icon: mdi:home
    cards:
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: cover.brama_wynajem_zaslona
            name: Brama
            icon: mdi:gate
            tap_action:
              action: toggle
          - type: tile
            entity: light.boneio_32_l_07_73bbd8_door_23_relay
            name: Drzwi
            icon: mdi:door-closed-lock
            tap_action:
              action: perform-action
              perform_action: input_button.press
              target:
                entity_id: input_button.btn_entrance_door
          - type: tile
            entity: script.all_lights_off
            name: Wyłącz Wszystko
            icon: mdi:lightbulb-off
            color: red
          - type: tile
            entity: input_boolean.motion_lights_disabled
            name: Czujniki
            icon: |
              {% if is_state('input_boolean.motion_lights_disabled', 'on') %}
                mdi:motion-sensor-off
              {% else %}
                mdi:motion-sensor
              {% endif %}
            color: |
              {% if is_state('input_boolean.motion_lights_disabled', 'on') %}
                red
              {% else %}
                green
              {% endif %}
            tap_action:
              action: toggle
      - square: false
        type: grid
        columns: 2
        cards:
          - type: tile
            entity: sensor.paczkomat_mar13m_air_index_level
            name: Jakość Powietrza
            icon: mdi:air-filter
          - type: tile
            entity: sensor.paczkomat_mar13m_temperature
            name: Temp. Zewnętrzna
            icon: mdi:thermometer
          - type: tile
            entity: sensor.paczkomat_mar13m_pm25
            name: Pył PM2.5
            icon: mdi:blur
          - type: tile
            entity: sensor.paczkomat_mar13m_pm10
            name: Pył PM10
            icon: mdi:blur-radial
          - type: tile
            entity: sensor.paczkomat_mar13m_humidity
            name: Wilgotność Zewn.
            icon: mdi:water-percent
          - type: tile
            entity: sensor.paczkomat_mar13m_pressure
            name: Ciśnienie Zewn.
            icon: mdi:gauge
      - type: weather-forecast
        entity: weather.forecast_home
        name: Pogoda Dom
        show_current: true
        show_forecast: true
        forecast_type: daily
      - type: entities
        title: Energia i Info
        entities:
          - entity: sensor.pstryk_koszt_dzis_dol
            name: Koszt Dziś (Dół)
            icon: mdi:cash-clock
          - entity: sensor.pstryk_koszt_dzis_gora
            name: Koszt Dziś (Góra)
            icon: mdi:cash-multiple
          - entity: binary_sensor.pstryk_in_ev_best_window_dol
            name: Okno EV (Aktywne)
            icon: mdi:car-electric
          - type: conditional
            conditions:
              - entity: input_boolean.deye_battery_installed
                state: "on"
            row:
              entity: sensor.deye_battery_display_level
              name: Magazyn Energii (Poziom)
              icon: mdi:battery-high
          - type: conditional
            conditions:
              - entity: input_boolean.deye_battery_installed
                state: "on"
            row:
              entity: sensor.deye_battery_working_state
              name: Magazyn Energii (Stan)
              icon: mdi:battery-sync
          - entity: sensor.pstryk_powerbank_best_window_dol
            name: Okno Magazynu (Najtańsze)
            icon: mdi:battery-charging
          - entity: sensor.pstryk_best_sell_window_dol
            name: Szczyt Cenowy (Zasilanie Bateryjne)
            icon: mdi:battery-arrow-down
          - entity: sensor.nastepny_wywoz_odpadow
            name: Odpady
            icon: mdi:truck-clock
      - square: false
        type: grid
        columns: 3
        cards:
          - type: light
            entity: light.boneio_32_l_07_new_light_01
            name: Wejście
            icon: mdi:door-open
          - type: light
            entity: light.boneio_dr_8ch_03_2c7fbc_chl_01
            name: Korytarz Wejście
            icon: mdi:light-recessed
          - type: light
            entity: light.boneio_dr_8ch_03_2c7fbc_chr_04
            name: Lustro
            icon: mdi:mirror
          - type: light
            entity: light.boneio_dr_8ch_03_2c7fbc_chl_04
            name: Kuchnia Główne
            icon: mdi:ceiling-light
          - type: light
            entity: light.boneio_32_l_07_new_light_05
            name: Kuchnia Wyspa
            icon: mdi:island
          - type: light
            entity: light.boneio_32_l_07_new_light_06
            name: Jadalnia
            icon: mdi:table-chair
          - type: light
            entity: light.boneio_dr_8ch_03_2c7fbc_chl_02
            name: Korytarz Sypialnie
            icon: mdi:bed-outline
          - type: light
            entity: light.bulb_1
            name: Taras (Lewa + Prawa)
            icon: mdi:lightbulb-group
            tap_action:
              action: perform-action
              perform_action: light.toggle
              target:
                entity_id:
                  - light.bulb_1
                  - light.bulb_2
          - type: light
            entity: light.boneio_32_l_07_new_light_12
            name: Podjazd
            icon: mdi:car-light-high
      - square: false
        type: grid
        columns: 2
        cards:
          - show_state: true
            show_name: true
            camera_view: auto
            fit_mode: cover
            type: picture-entity
            entity: camera.reolink_duo_floodlight_poe_plynny_2
            name: Podwórze
          - show_state: true
            show_name: true
            camera_view: auto
            fit_mode: cover
            type: picture-entity
            entity: camera.rlc_822a_plynny
            name: Wejście
          - show_state: true
            show_name: true
            camera_view: auto
            fit_mode: cover
            type: picture-entity
            entity: camera.taras_plynny
            name: Taras
          - show_state: true
            show_name: true
            camera_view: auto
            fit_mode: cover
            type: picture-entity
            entity: camera.rlc_820a_niska_rozdzielczosc
            name: Klatka 1p
          - show_state: true
            show_name: true
            camera_view: auto
            fit_mode: cover
            type: picture-entity
            entity: camera.520a_plynny
            name: Front / Brama
      - type: entities
        entities:
          - entity: input_select.shelly_mode
            name: Tryb Salon
          - entity: input_number.shelly_brightness
            name: Jasność
          - entity: input_number.kolor_bialy_salon
            name: Kanał Biały
          - entity: input_number.kolor_czerwony_salon
            name: Kanał Czerwony
