  - title: Energia
    path: energia
    icon: mdi:transmission-tower
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Teraz
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.deye_battery_display_level
                name: Poziom Baterii
                icon: mdi:battery-high
                color: green
              - type: tile
                entity: sensor.deye_battery_working_state
                name: Tryb Pracy Magazynu
                icon: mdi:battery-sync
                color: blue
              - type: tile
                entity: sensor.deye_battery_operating_capacity_kwh
                name: Pojemność Użyteczna
                icon: mdi:battery-heart-variant
                color: teal
              - type: tile
                entity: sensor.deye_battery_blackout_reserve_kwh
                name: Rezerwa Blackout
                icon: mdi:battery-alert
                color: red
              - type: tile
                entity: sensor.deye_charge_power_kw
                name: Max Moc Ładowania
                icon: mdi:transmission-tower-import
                color: purple
              - type: tile
                entity: sensor.deye_discharge_power_kw
                name: Max Moc Oddawania
                icon: mdi:transmission-tower-export
                color: amber
          - type: entities
            title: Aktywne Okna
            show_header_toggle: false
            entities:
              - entity: binary_sensor.pstryk_in_ev_best_window_dol
                name: Trwa Okno EV
                icon: mdi:car-electric
              - entity: binary_sensor.pstryk_in_powerbank_best_window_dol
                name: Trwa Okno Magazynu
                icon: mdi:battery-charging
              - entity: binary_sensor.pstryk_in_sell_window_dol
                name: Trwa Szczyt Cenowy
                icon: mdi:battery-arrow-down
          - type: markdown
            content: >-
              {% set src = state_attr('sensor.pstryk_price_meter_dol', 'plan_source') %}
              {% set why = state_attr('sensor.pstryk_price_meter_dol', 'fallback_reason') %}
              **Plan:** {{ 'AI' if src == 'ai' else ('Algorytm' ~ (' (' ~ why ~ ')' if why else '') if src else '—') }}
          - type: button
            name: Szczegółowy Raport i Historia Zużycia
            icon: mdi:chart-timeline-variant
            tap_action:
              action: navigate
              navigation_path: /dashboard-home/energia-raport
      - type: grid
        cards:
          - type: heading
            heading: Plan
          - type: markdown
            title: Plan Baterii
            content: |-
              {% set tl = state_attr('sensor.pstryk_price_meter_dol', 'plan_timeline') %}
              {% set roles = {'charge': '⚡ Ładowanie', 'topup': '🔌 Doładowanie', 'peak': '🔥 Szczyt', 'hold': '⏸ Wstrzymanie', 'drain': '🏠 Autokonsumpcja'} %}
              {% if tl and tl | length > 0 -%}
              {% set ns = namespace(day='') -%}
              {% for e in tl -%}
              {% set st = as_local(as_datetime(e.start)) -%}
              {% set en = as_local(as_datetime(e.end)) -%}
              {% set d = st.strftime('%Y-%m-%d') -%}
              {% if d != ns.day -%}
              {% set ns.day = d %}
              **{{ d }}**

              | Godz. | Rola → cel | Prognoza | Cena |
              |:---:|:---|:---:|:---:|
              {% endif -%}
              | `{{ '~' if e.estimated | default(false) else '' }}{{ st.strftime('%H') if st.minute == 0 else st.strftime('%H:%M') }}–{{ en.strftime('%H') if en.minute == 0 else en.strftime('%H:%M') }}` | {{ roles.get(e.role, e.role) }}{% if e.charge_a %} ({{ e.charge_a }} A){% endif %} → {{ e.target_soc }}% | {{ e.soc_end }}% | {{ '%.3f'|format(e.price) }} |
              {% endfor %}
              {%- else -%}
              *⏳ Oczekiwanie na plan baterii...*
              {%- endif %}
          - type: markdown
            title: Tabela w falowniku (24 h)
            content: |-
              {% set nom_v = states('sensor.powerbank_voltage_v') | float(0.0) %}
              {% set active = state_attr('sensor.deye_inverter_status', 'active_tou') %}
              {% set slots = active['slots'] if active and active['slots'] is defined else (state_attr('sensor.deye_tou_active_schedule', 'slots') if state_attr('sensor.deye_tou_active_schedule', 'slots') is defined else []) %}
              {% set planned_a = states('sensor.deye_inverter_recommended_charge_current') if states('sensor.deye_inverter_recommended_charge_current') not in ['unknown', 'unavailable', ''] else (states('sensor.deye_inverter_max_charge_current') if states('sensor.deye_inverter_max_charge_current') not in ['unknown', 'unavailable', ''] else '-') %}
              {% set active_a = states('sensor.deye_inverter_max_charge_current') if states('sensor.deye_inverter_max_charge_current') not in ['unknown', 'unavailable', ''] else '-' %}
              {% if slots and slots | length == 6 -%}
              > ⚡ **Planowany Prąd Ładowania:** `{{ planned_a }}{% if planned_a != '-' %} A{% endif %}` &nbsp;|&nbsp; 🔌 **Deye Reg 108 (Aktualny w Falowniku):** `{{ active_a }}{% if active_a != '-' %} A{% endif %}`

              | Godz. | Tryb | Cel | Sieć |
              |:---:|:---|:---:|:---:|
              {% for s in slots -%}
              | `{{ s.time }}` | {% if s.grid_charge %}**⚡ Ładowanie: {{ s.target_charge_current_a if s.target_charge_current_a is defined and s.target_charge_current_a is not none else (s.charge_current_a if s.charge_current_a is defined and s.charge_current_a is not none else planned_a) }}{% if (s.target_charge_current_a if s.target_charge_current_a is defined and s.target_charge_current_a is not none else (s.charge_current_a if s.charge_current_a is defined and s.charge_current_a is not none else planned_a)) != '-' %} A{% endif %}**{% else %}Oddawanie: {{ s.display_power_w if s.display_power_w is defined and s.display_power_w is not none else (s.power_w if s.power_w is defined else 7170) }} W (~{{ s.display_current_a if s.display_current_a is defined and s.display_current_a is not none else (s.discharge_current_a if s.discharge_current_a is defined and s.discharge_current_a is not none else (((s.power_w if s.power_w is defined else 7170) / (nom_v if nom_v > 0 else 51.2)) | round(0))) }} A){% endif %}<br><sub>{{ s.label if s.label else ('Najtańsze Ładowanie' if s.grid_charge else ('Czuwanie Przed Szczytem' if s.target_soc >= 80 else 'Autokonsumpcja PV')) }}</sub> | {{ s.target_soc }}% | {{ '⚡' if s.grid_charge else '–' }} |
              {% endfor %}

              {% else -%}
              *⏳ Oczekiwanie na synchronizację z falownikiem Deye...*
              {% endif %}
          - type: entities
            title: Rekomendowane Okna
            show_header_toggle: false
            entities:
              - entity: sensor.pstryk_ev_best_window_dol
                name: Okno EV
                icon: mdi:car-electric
              - entity: sensor.pstryk_powerbank_best_window_dol
                name: Okno Magazynu
                icon: mdi:battery-charging
              - entity: sensor.pstryk_best_sell_window_dol
                name: Szczyt Cenowy (bateria)
                icon: mdi:battery-arrow-down
      - type: grid
        cards:
          - type: heading
            heading: Ustawienia baterii
          - type: entities
            title: Automatyczne TOU
            show_header_toggle: false
            entities:
              - entity: input_boolean.deye_tou_auto_sync
                name: Automatyczne przeliczanie TOU
                icon: mdi:robot
              - type: conditional
                conditions:
                  - entity: input_boolean.deye_tou_auto_sync
                    state: "on"
                row:
                  type: button
                  name: Wymuś przeliczenie i zapis TOU teraz
                  icon: mdi:cloud-sync
                  action_name: Przelicz
                  tap_action:
                    action: perform-action
                    perform_action: script.sync_deye_inverter_tou
                    data:
                      force: true
          - type: conditional
            conditions:
              - entity: input_boolean.deye_tou_auto_sync
                state: "off"
            card:
              type: entities
              title: Ręczny Harmonogram TOU
              show_header_toggle: false
              entities:
                - type: section
                  label: Slot 1
                - entity: input_datetime.deye_manual_tou_time_1
                  name: Godzina
                - entity: input_number.deye_manual_tou_soc_1
                  name: Docelowy SOC
                - entity: input_boolean.deye_manual_tou_grid_charge_1
                  name: Ładowanie z sieci
                - type: section
                  label: Slot 2
                - entity: input_datetime.deye_manual_tou_time_2
                  name: Godzina
                - entity: input_number.deye_manual_tou_soc_2
                  name: Docelowy SOC
                - entity: input_boolean.deye_manual_tou_grid_charge_2
                  name: Ładowanie z sieci
                - type: section
                  label: Slot 3
