    # Local 01
    # Local 01
  - light:
    # schema: template
      unique_id: salon_mqtt
      name: "Salon MQTT"
    #   command_topic: "shellies/shellyrgbw2-814843/color/0/command"
      qos: 2
      rgbw_command_topic: "shellies/shellyrgbw2-814843/color/0/set"
      rgbw_state_topic: "shellies/shellyrgbw2-814843/color/0/status"
      rgbw_command_template: >
        {"red": {{ red }}, "green": {{ green }}, "blue": {{ blue }}, "white": {{ white }} }
      rgbw_value_template: > 
        {{value_json.red|int}},{{value_json.green|int}},{{value_json.blue|int}},{{value_json.white|int}}
      brightness_scale: 100
      brightness_command_topic: "shellies/shellyrgbw2-814843/color/0/set"
      brightness_state_topic: "shellies/shellyrgbw2-814843/color/0/status"
      brightness_command_template: >
        {%- if value == 1 -%}
          { "gain": 0 }
        {%- else -%}
          { "gain": {{ value }} }
        {%- endif -%}
      brightness_value_template: "{{ value_json.gain }}"
      command_topic: "shellies/shellyrgbw2-814843/color/0/command"
      state_topic: "shellies/shellyrgbw2-814843/color/0/status"
      payload_on: "on"
      payload_off: "off"
      state_value_template: >
        {%- if value_json.ison -%}
          on
        {%- else -%}
          off
        {%- endif -%}
      effect_list:
        - 0
        - 1
        - 2
        - 3
        # - 4
        # - 5
        # - 6
      effect_command_topic: "shellies/shellyrgbw2-814843/color/0/set"
      effect_state_topic: "shellies/shellyrgbw2-814843/color/0/status"
      effect_command_template: >
        {"effect": {{ value }} }
      effect_value_template: "{{ value_json.effect }}"
